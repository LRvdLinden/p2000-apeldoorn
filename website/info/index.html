<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-Alerts</title>
<meta name="description" content="Privacyverklaring, cookies, gebruiksvoorwaarden, disclaimer en wat er nieuw is in A-Alerts.">
<link rel="canonical" id="canonical" href="https://a-alerts.nl/info/?p=privacy">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="../assets/img/aalerts-icon-32.png">
<link rel="stylesheet" href="../assets/css/base.css?v=57">
<style>
  body { padding: 0 16px 60px; }
  header { max-width: 760px; margin: 0 auto; padding: 20px 0; display: flex; align-items: center; gap: 10px; }
  header a { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; }
  header .shield { width: 36px; height: 36px; }
  header nav { margin-left: auto; display: flex; gap: 16px; font-size: .9rem; }
  header nav a { font-weight: 500; color: var(--muted); }
  article { max-width: 760px; margin: 0 auto; background: var(--surface); border-radius: 24px; padding: clamp(20px, 4vw, 40px); box-shadow: var(--shadow); }
  article h1 { font-family: var(--display); font-weight: 900; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.05; margin: 0 0 .3em; }
  article h2, article h3 { margin-top: 1.6em; }
  article .meta { color: var(--muted); font-size: .9rem; margin-bottom: 2em; }
  article a { color: var(--red); }
</style>
<script src="../config.js?v=57"></script>
<script src="../assets/js/consent.js?v=59" defer></script>
</head>
<body>
<header>
  <a href="../"><span class="shield appmark"><img src="../assets/img/aalerts-icon-180.png" alt="" width="40" height="40"></span>A-Alerts</a>
  <nav><a href="?p=privacy">Privacy</a><a href="?p=terms">Voorwaarden</a><a href="?p=disclaimer">Disclaimer</a><a href="?p=cookies">Cookies</a><a href="?p=changelog">Wat is nieuw</a><a href="../pager/">Live pager</a></nav>
</header>
<article id="doc"><p>Laden…</p></article>
<script>
  // The texts now live on their own pages; old links keep working.
  (function () {
    var map = { privacy: "privacy", cookies: "cookies", terms: "voorwaarden", disclaimer: "disclaimer", changelog: "wat-is-nieuw" };
    var p = new URLSearchParams(location.search).get("p") || "privacy";
    location.replace("/" + (map[p] || "privacy") + "/" + location.hash);
  })();
</script>
<script type="module">
  import { API, esc, trackVisit } from "../assets/js/core.js?v=57";
  trackVisit();
  const names = { privacy: "Privacyverklaring", cookies: "Cookies", terms: "Gebruiksvoorwaarden", disclaimer: "Disclaimer", changelog: "Wat is nieuw" };
  const p = new URLSearchParams(location.search).get("p");
  const name = names[p] ? p : "privacy";
  const doc = document.getElementById("doc");
  let data = null;
  for (const url of [`../data/${name}.json`, `${API}/v1/content/${name}`]) {
    try { const r = await fetch(url); if (r.ok) { data = await r.json(); if (data) break; } } catch {}
  }
  // Only a small, safe subset of HTML from our own content files.
  const clean = (html) => {
    const t = document.createElement("template");
    t.innerHTML = html || "";
    t.content.querySelectorAll("script,style,iframe,object,embed,form,link,meta").forEach((n) => n.remove());
    t.content.querySelectorAll("*").forEach((n) => [...n.attributes].forEach((a) => {
      if (/^on/i.test(a.name) || a.name === "style" || (a.name === "href" && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
    }));
    return t.innerHTML;
  };
  document.title = `${names[name]} – A-Alerts`;
  document.getElementById("canonical").href = `https://a-alerts.nl/info/?p=${name}`;
  const datum = (d) => new Date(d).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  if (Array.isArray(data)) {
    // Changelog: a list of versions, newest first.
    doc.innerHTML = `<h1>${names[name]}</h1>` + data.map((v) =>
      `<section class="versie" id="v${esc(v.version || v.id)}"><h2>${esc(v.version || "")} · ${esc(v.title || "")}</h2>${v.release_date ? `<p class="meta">${esc(datum(v.release_date))}</p>` : ""}${clean(v.content || "")}</section>`).join("");
  } else doc.innerHTML = data
    ? `<h1>${esc(data.title || names[name])}</h1>${data.updated_at || data.last_updated ? `<p class="meta">Laatst bijgewerkt: ${esc(new Date(data.updated_at || data.last_updated).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" }))}</p>` : ""}${clean(data.content || data.html || "")}`
    : `<h1>${names[name]}</h1><p>Deze tekst kon niet worden geladen.</p>`;
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
</script>
</body>
</html>
