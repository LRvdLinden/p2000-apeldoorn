<!doctype html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meldkamer – A-Alerts</title>
<meta name="description" content="Meldkamerweergave van A-Alerts: live kaart die zelf langs de meldingen gaat, alarmscherm bij nieuwe meldingen en vandaag tegenover gisteren. Ideaal voor een groot scherm.">
<meta name="theme-color" content="#0b0b0f">
<meta property="og:title" content="Meldkamer – A-Alerts">
<meta property="og:description" content="Live kaart, alarmscherm en tellingen van vandaag voor op een groot scherm.">
<meta property="og:image" content="https://a-alerts.nl/assets/img/og-image.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://a-alerts.nl/meldkamer/">
<meta property="og:site_name" content="A-Alerts">
<meta property="og:locale" content="nl_NL">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-alerts.nl/meldkamer/">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" href="../assets/img/aalerts-icon-32.png">
<link rel="apple-touch-icon" href="../assets/img/aalerts-icon-180.png">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/meldkamer.css">
<script src="../config.js"></script>
<script src="../assets/js/consent.js" defer></script>
<script type="module" src="../assets/js/meldkamer.js"></script>
</head>
<body class="mk" data-maps>

<noscript><p style="padding:20px">De meldkamerweergave van A-Alerts toont live alle P2000-meldingen in de gemeente Apeldoorn op een kaart. Zet JavaScript aan om de meldingen te zien.</p></noscript>

<main class="room" id="room">
  <section class="map-wrap" aria-label="Kaart">
    <div id="map" class="map"></div>
    <div class="map-top">
      <div class="chips" id="chips"></div>
      <span class="pill">Laatste 24 uur</span>
    </div>
    <div class="latest" id="latest" aria-live="polite"></div>
    <div class="controls">
      <button id="btnTour" class="ctl on" title="Kaart gaat zelf langs de meldingen"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5A2.5 2.5 0 1 0 12 11.5 2.5 2.5 0 0 0 12 6.5z" fill="currentColor"/></svg><span>Rondleiding</span></button>
      <button id="btnSound" class="ctl" title="Geluid bij nieuwe meldingen"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12 .5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Geluid uit</span></button>
      <button id="btnUrgent" class="ctl" title="Alarmscherm alleen bij spoed (A1/P1)"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3zm0 6v5m0 3v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Alarm: alles</span></button>
      <button class="ctl" data-consent-open title="Cookie-instellingen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.3A9 9 0 1 1 11.7 3a3 3 0 0 0 3.8 3.8 3 3 0 0 0 3.7 3.7 3 3 0 0 0 1.8 1.8z"/><circle cx="8.5" cy="10.5" r="1" fill="currentColor"/><circle cx="12" cy="15.5" r="1" fill="currentColor"/><circle cx="16" cy="14" r="1" fill="currentColor"/></svg><span>Cookies</span></button>
      <button id="btnFull" class="ctl" title="Volledig scherm"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Volledig scherm</span></button>
    </div>
  </section>

  <aside class="side" aria-label="Meldkamer">
    <header class="head">
      <a class="brand" href="../" aria-label="Naar de homepage">
        <span class="shield appmark"><img src="../assets/img/aalerts-icon-180.png" alt="" width="40" height="40"></span>
        <span><b>A-Alerts</b><small id="status"><span class="live-dot"></span><span>Verbinden…</span></small></span>
      </a>
      <div class="clock"><b id="clock">--:--:--</b><small id="date"></small></div>
    </header>

    <div class="demo" id="demo" hidden>Voorbeeldmeldingen · de live-server is nog niet bereikbaar</div>

    <div class="knmi-bar" id="knmi"></div>
    <div class="tiles" id="tiles"></div>
    <div class="vs" id="vs"></div>

    <div class="list-head"><span>Laatste meldingen</span><a href="../pager/">Naar de live pager →</a></div>
    <div class="list" id="list"></div>
  </aside>
</main>

<div class="alarm" id="alarm" hidden role="alert"></div>
</body>
</html>
