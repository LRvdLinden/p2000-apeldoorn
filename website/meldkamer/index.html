<!doctype html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meldkamer – P2000 Apeldoorn</title>
<meta name="description" content="Meldkamerweergave van P2000 Apeldoorn: live kaart die zelf langs de meldingen gaat, alarmscherm bij nieuwe meldingen en vandaag tegenover gisteren. Ideaal voor een groot scherm.">
<meta name="theme-color" content="#0b0b0f">
<meta property="og:title" content="Meldkamer – P2000 Apeldoorn">
<meta property="og:description" content="Live kaart, alarmscherm en tellingen van vandaag voor op een groot scherm.">
<meta property="og:image" content="https://p2000-apeldoorn.nl/assets/img/og-image.jpg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://p2000-apeldoorn.nl/meldkamer/">
<meta property="og:site_name" content="P2000 Apeldoorn">
<meta property="og:locale" content="nl_NL">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://p2000-apeldoorn.nl/meldkamer/">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" href="../assets/img/appicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/appicon-180.png">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/meldkamer.css">
<script src="../config.js"></script>
<script type="module" src="../assets/js/meldkamer.js"></script>
</head>
<body class="mk">

<noscript><p style="padding:20px">De meldkamerweergave van P2000 Apeldoorn toont live alle P2000-meldingen in de gemeente Apeldoorn op een kaart. Zet JavaScript aan om de meldingen te zien.</p></noscript>

<main class="room" id="room">
  <section class="map-wrap" aria-label="Kaart">
    <div id="map" class="map"></div>
    <div class="map-top">
      <div class="chips" id="chips"></div>
      <span class="pill">Laatste 24 uur</span>
    </div>
    <div class="latest" id="latest" aria-live="polite"></div>
    <div class="controls">
      <button id="btnTour" class="ctl on" title="Kaart gaat zelf langs de meldingen"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5A2.5 2.5 0 1 0 12 11.5 2.5 2.5 0 0 0 12 6.5z" fill="currentColor"/></svg><span>Rondleiding</span></button>
      <button id="btnSound" class="ctl" title="Geluid bij nieuwe meldingen"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12 .5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Geluid uit</span></button>
      <button id="btnUrgent" class="ctl" title="Alarmscherm alleen bij spoed (A1/P1)"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3zm0 6v5m0 3v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Alarm: alles</span></button>
      <button id="btnFull" class="ctl" title="Volledig scherm"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Volledig scherm</span></button>
    </div>
  </section>

  <aside class="side" aria-label="Meldkamer">
    <header class="head">
      <a class="brand" href="../" aria-label="Naar de homepage">
        <span class="shield"><svg viewBox="3 1 18 22"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="#fff"/><circle cx="12" cy="17.4" r="1.5" fill="#cf0a1e"/><rect x="11" y="6.5" width="2" height="7.5" rx="1" fill="#cf0a1e"/></svg></span>
        <span><b>P2000 Apeldoorn</b><small id="status"><span class="live-dot"></span><span>Verbinden…</span></small></span>
      </a>
      <div class="clock"><b id="clock">--:--:--</b><small id="date"></small></div>
    </header>

    <div class="demo" id="demo" hidden>Voorbeeldmeldingen · de live-server is nog niet bereikbaar</div>

    <div class="tiles" id="tiles"></div>
    <div class="vs" id="vs"></div>

    <div class="list-head"><span>Laatste meldingen</span><a href="../pager/">Naar de live pager →</a></div>
    <div class="list" id="list"></div>
  </aside>
</main>

<div class="alarm" id="alarm" hidden role="alert"></div>
</body>
</html>
