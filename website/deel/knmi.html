<script>
// Share link (a-alerts.nl/melding/<dienst>/<guid> or /waarschuwing/<id>): straight on to the live pager.
// With the app installed the link opens in the app itself; this page is only for the link preview.
(function () {
  var p = location.pathname.split("/").filter(Boolean), doel = "/pager/";
  try {
    if (p[0] === "melding" && p.length > 1) doel += "?melding=" + encodeURIComponent(decodeURIComponent(p[p.length - 1]));
    else if (p[0] === "waarschuwing" && p.length > 1) doel += "?waarschuwing=" + encodeURIComponent(decodeURIComponent(p.slice(1).join("/")));
  } catch (e) {}
  location.replace(doel + location.hash);
})();
</script>
