<body class="app" data-maps>
<h1 class="sr-only">Live pager: alle meldingen in de gemeente Apeldoorn</h1>

<header class="topbar">
  <a class="brand" href="../" aria-label="Naar de homepage">
    <span class="shield appmark"><img src="../assets/img/aalerts-icon-180.png" alt="" width="40" height="40"></span>
    <span class="brand-text"><b>A-Alerts</b><small id="status"><span class="live-dot"></span><span>Verbinden…</span></small></span>
  </a>
  <nav class="tabs" role="tablist" aria-label="Weergave">
    <button role="tab" data-tab="pager" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 5h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Pager</span></button>
    <button role="tab" data-tab="kaart" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 0v14m6-12v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Kaart</span></button>
    <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Statistieken</span></button>
  </nav>
  <a class="mk-link" href="../nieuws/" title="Politienieuws, weerartikelen en liveblogs"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2V5zm13 4h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7M7 16h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Nieuws</span></a>
  <a class="mk-link" href="../meldkamer/" title="Meldkamerweergave voor een groot scherm"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Meldkamer</span></a>
  <div class="clock"><b id="clock">--:--:--</b><small id="dateLabel"></small></div>
</header>

<div class="demo-banner" id="demoBanner" hidden>
  De live-server is nog niet bereikbaar. Je ziet <b>voorbeeldmeldingen</b>.
</div>

<noscript><p style="padding:20px">De live pager van A-Alerts toont alle P2000-meldingen van brandweer, ambulance, politie en traumaheli in de gemeente Apeldoorn van de laatste 24 uur. Zet JavaScript aan om de meldingen te zien.</p></noscript>
<main class="shell" id="shell" data-tab="pager">
  <!-- LIST -->
  <section class="pane list-pane" aria-label="Meldingen">
    <div class="knmi-bar" id="knmiBar"></div>
    <div class="tiles" id="tiles"></div>
    <div class="toolbar">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Zoek op plaats, straat of capcode" autocomplete="off"></label>
      <button class="icon-btn" id="filterBtn" aria-expanded="false" aria-controls="filters" title="Filters"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="badge" id="filterCount" hidden></span></button>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="field"><span>Plaats</span><select id="fPlaats"><option value="">Alle plaatsen</option></select></div>
      <div class="field"><span>Prioriteit</span><select id="fPrio">
        <option value="">Alle prioriteiten</option><option value="urgent">Alleen spoed (A1, P1)</option><option value="A1">A1</option><option value="A2">A2</option><option value="B">B1 / B2</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option></select></div>
      <div class="field"><span>Alleen</span><select id="fBron">
        <option value="">Meldingen en waarschuwingen</option><option value="nlalert">Alleen NL-Alert</option><option value="burgernet">Alleen Burgernet</option><option value="amber">Alleen AMBER Alert</option><option value="vermistkind">Alleen Vermist Kind Alert</option></select></div>
      <div class="field"><span>Mijn buurt</span><select id="fRadius">
        <option value="0">Uit</option><option value="1">1 km rond mij</option><option value="2">2 km rond mij</option><option value="5">5 km rond mij</option><option value="10">10 km rond mij</option></select></div>
      <label class="switch"><input type="checkbox" id="fHideRead"><i></i><span>Verberg bekeken meldingen</span></label>
      <button class="link-btn" id="resetFilters">Filters wissen</button>
    </div>
    <div class="seg view-seg" id="viewSeg" role="tablist" aria-label="Lijst">
      <button data-view="meldingen" class="on" role="tab">Meldingen</button>
      <button data-view="waarschuwingen" role="tab">Alle waarschuwingen</button>
    </div>
    <div class="active-filters" id="activeFilters"></div>
    <div class="list" id="list" aria-live="polite"></div>
  </section>

  <!-- DETAIL -->
  <section class="pane detail-pane" id="detailPane" aria-label="Melding">
    <div class="empty-detail" id="emptyDetail">
      <img src="../assets/img/aalerts-icon-180.png" alt="" width="84" height="84">
      <p>Kies een melding om de details te zien.</p>
    </div>
    <div id="detail"></div>
  </section>

  <!-- MAP -->
  <section class="pane map-pane" aria-label="Kaart">
    <div id="bigMap" class="bigmap"></div>
    <div class="map-ui">
      <div class="seg" id="period"><button data-h="6">6 uur</button><button data-h="24" class="on">24 uur</button></div>
      <div class="chips" id="mapChips"></div>
      <div class="chips lagen" id="mapLagen" aria-label="Kaartlagen"></div>
    </div>
    <div class="cluster-panel" id="clusterPanel" hidden></div>
    <div class="map-fallback" id="mapFallback" hidden>
      <p id="mapFallbackText">De kaart is nog niet beschikbaar.</p>
    </div>
  </section>

  <!-- STATS -->
  <section class="pane stats-pane" aria-label="Statistieken" id="stats"></section>
</main>

<nav class="bottom-tabs" aria-label="Weergave">
  <button data-tab="pager" class="on"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 5h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Pager</button>
  <button data-tab="kaart"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 0v14m6-12v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Kaart</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Statistieken</button>
</nav>

<template id="tplToast"><div class="toast"></div></template>
