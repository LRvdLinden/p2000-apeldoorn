<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>P2000Beheer</title>
<meta name="theme-color" content="#0d0e12">
<link rel="icon" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<!-- LOGIN -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <img src="img/icon-180.png" alt="" width="96" height="96">
    <h1>P2000Beheer</h1>
    <p>Beheer van P2000 Apeldoorn</p>
    <input id="user" name="username" autocomplete="username" placeholder="Gebruikersnaam" value="LRvdLinden" required>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Wachtwoord" minlength="6" required>
    <p id="loginError" class="error" hidden></p>
    <button type="submit" class="btn primary" id="loginBtn">Inloggen</button>
  </form>
</section>

<!-- APP -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="side-brand"><img src="img/icon-64.png" alt="" width="34" height="34"><b>P2000Beheer</b></div>
    <nav id="nav">
      <a href="#dashboard" data-view="dashboard"><span>📊</span>Dashboard</a>
      <a href="#meldingen" data-view="meldingen"><span>🚨</span>Meldingen</a>
      <a href="#push" data-view="push"><span>📣</span>Push</a>
      <a href="#teksten" data-view="teksten"><span>📄</span>Teksten</a>
      <a href="#instellingen" data-view="instellingen"><span>⚙️</span>Instellingen</a>
    </nav>
    <div class="side-foot"><span id="whoami"></span><button class="link" id="logout">Uitloggen</button></div>
  </aside>
  <main class="main">
    <header class="top"><h1 id="title">Dashboard</h1><div class="top-actions"><span id="updated" class="muted"></span><button class="btn" id="refresh">↻ Vernieuwen</button></div></header>
    <div id="error" class="banner" hidden></div>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast" hidden></div>
</body>
</html>
