# Cloudflare Worker: the API + ingest + pushmeldingen for A-Alerts.
# Name, database and workers.dev address keep their old names so nothing has to move.
# Deployed by the GitHub workflow "Worker" (database_id is filled in there).
name = "p2000-apeldoorn-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "p2000-apeldoorn"
database_id = "__D1_DATABASE_ID__"

[vars]
# Homey webhooks come from api.a-alerts.nl (aa/homey.php) since 21-11-2026; "0" makes this Worker send them again.
HOMEY_VIA_API = "1"
RETENTION_DAYS = "3"
POLLS_PER_RUN = "5"
# Dedicated client ID tested against Koyeb; unrelated to the user's Homey device.
KOYEB_SUBPROTOCOL = "homey-a11ea1eaa11ea1eaa11ea1ea-nl.lrvdlinden.p2000"
APN_TOPIC = "nl.lrvdlinden.p2000apeldoorn"
# Lowest build of the apps that still works; an older build shows "Werk de app bij". 0 = no minimum.
MIN_BUILD_IOS = "0"
MIN_BUILD_ANDROID = "0"
WEB_WEATHERKIT_SERVICE_ID = "nl.lrvdlinden.p2000apeldoorn.weatherkit"

# Koyeb is enabled only after KOYEB_SUBPROTOCOL is set as a Worker secret.
# Never reuse the Homey P2000 app's exact WebSocket subprotocol.
[[durable_objects.bindings]]
name = "KOYEB_LISTENER"
class_name = "AAlertsKoyebListener"

[[migrations]]
tag = "a-alerts-koyeb-v1"
new_sqlite_classes = ["AAlertsKoyebListener"]

[observability]
enabled = true
