name: Android

# Builds the A-Alerts Android app (APK) from android/.
# Secrets (optional; without them the build still runs):
#   GOOGLE_SERVICES_JSON      google-services.json from Firebase (push notifications)
#   ANDROID_KEYSTORE_B64      release keystore, base64
#   ANDROID_KEYSTORE_PASSWORD password of the keystore and the key (alias a-alerts)
# Result: artifact "A-Alerts-apk" with A-Alerts.apk and android.json (for a-alerts.nl/downloads/).
on:
  workflow_dispatch:
  push:
    branches: [a-alerts, main]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }

      - name: Firebase (push)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; echo "Firebase: aan"; else echo "::warning::GOOGLE_SERVICES_JSON ontbreekt – APK zonder pushmeldingen."; fi

      - name: Keystore
        id: ks
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}", KSP: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=a-alerts" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Geen release-keystore – APK wordt ongetekend gebouwd (alleen voor test)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: APK + android.json
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/A-Alerts.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then "$BT/apksigner" verify --print-certs out/A-Alerts.apk | head -5; fi
          # apksigner.jar and zipalign so an unsigned test APK can be signed elsewhere.
          cp "$BT/lib/apksigner.jar" out/ || true
          cp "$BT/zipalign" out/ || true
          "$BT/aapt2" dump badging out/A-Alerts.apk | head -3
          SIZE=$(stat -c%s out/A-Alerts.apk)
          SHA=$(sha256sum out/A-Alerts.apk | cut -d' ' -f1)
          printf '{"version":"2.0.0","build":%s,"url":"https://a-alerts.nl/downloads/A-Alerts.apk","size":%s,"sha256":"%s","minAndroid":"7.0","notes":null}\n' "$ANDROID_BUILD" "$SIZE" "$SHA" > out/android.json
          cat out/android.json
          echo "### A-Alerts APK build $ANDROID_BUILD (getekend: ${{ steps.ks.outputs.signed }}) – $((SIZE/1024/1024)) MB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: A-Alerts-apk
          path: android/out/
          retention-days: 30
