name: Android

# Builds the A-Alerts Android app (APK) from android/.
# Secrets (optional; without them the build still runs):
#   GOOGLE_SERVICES_JSON      google-services.json from Firebase (push notifications)
#   ANDROID_KEYSTORE_B64      release keystore, base64
#   ANDROID_KEYSTORE_PASSWORD password of the keystore and the key (alias a-alerts)
# Result (also on branch android-build): artifact "A-Alerts-apk" with A-Alerts.apk and android.json (for a-alerts.nl/downloads/).
on:
  workflow_dispatch:
  push:
    branches: [a-alerts, main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Gradle-cache via de action; Gradle zelf met retries (services.gradle.org gaf herhaaldelijk HTTP 504).
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
      - name: Gradle 8.14.3
        working-directory: ${{ runner.temp }}
        run: |
          for url in https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip; do
            curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o gradle.zip "$url" && break
          done
          unzip -q gradle.zip && echo "$PWD/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Firebase (push)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; echo "Firebase: aan"; else echo "::warning::GOOGLE_SERVICES_JSON ontbreekt – APK zonder pushmeldingen."; fi

      - name: Keystore
        id: ks
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}", KSP: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=a-alerts" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Geen release-keystore – APK wordt ongetekend gebouwd (alleen voor test)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: APK + android.json
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/A-Alerts.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then "$BT/apksigner" verify --print-certs out/A-Alerts.apk | head -5; fi
          # apksigner.jar and zipalign so an unsigned test APK can be signed elsewhere.
          cp "$BT/lib/apksigner.jar" out/ || true
          cp "$BT/zipalign" out/ || true
          "$BT/aapt2" dump badging out/A-Alerts.apk | head -3
          SIZE=$(stat -c%s out/A-Alerts.apk)
          SHA=$(sha256sum out/A-Alerts.apk | cut -d' ' -f1)
          # Version from the APK itself (versionName in app/build.gradle.kts), never hard-coded.
          VER=$("$BT/aapt2" dump badging out/A-Alerts.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          printf '{"version":"%s","build":%s,"url":"https://a-alerts.nl/downloads/A-Alerts.apk","size":%s,"sha256":"%s","minAndroid":"7.0","notes":null}\n' "${VER:-2.0.1}" "$ANDROID_BUILD" "$SIZE" "$SHA" > out/android.json
          cat out/android.json
          echo "### A-Alerts APK build $ANDROID_BUILD (getekend: ${{ steps.ks.outputs.signed }}) – $((SIZE/1024/1024)) MB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: A-Alerts-apk
          path: android/out/
          retention-days: 30

      - name: Push to branch android-build
        run: |
          cd out
          git init -q -b android-build
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "A-Alerts APK build $ANDROID_BUILD from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build

      # Every new APK goes straight to a-alerts.nl/downloads/ and a-alerts.nl/android/ (version, build, size).
      - name: Website bijwerken met de nieuwe APK
        if: github.ref == 'refs/heads/a-alerts'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run website-deploy.yml --ref a-alerts -R "${{ github.repository }}"
