name: Android smoke test

# Installs the A-Alerts APK (debug-signed) on an Android emulator, opens every screen, takes screenshots
# and fails on a crash. Result: branch "android-screenshots" (force-pushed).
on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/android-smoke.yml, .github/android-smoke.sh]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/*.apk ../app.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/android-smoke.sh
      - name: Push screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b android-screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Android screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-screenshots
