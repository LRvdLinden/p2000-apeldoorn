name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" https://www.burgernet.nl/burgernet/3977386 -o bn.html
          python3 - <<'PY'
          import re
          h=open('bn.html',encoding='utf-8',errors='replace').read()
          i=h.find('action-detail-block__spec'); j=h.find('</main>', i)
          s=re.sub(r'\n\s*\n+','\n',h[i-200:j if j>0 else i+8000])
          print(s[:9000])
          PY
