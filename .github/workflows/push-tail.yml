name: API-controle (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.KNMI_WMS_KEY }}
    steps:
      - run: |
          Q='DATASET=radar_reflectivity_composites&SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=precipitation&STYLES=&CRS=EPSG:3857&BBOX=289000,6540000,868000,7150000&WIDTH=400&HEIGHT=420&FORMAT=image/png&TRANSPARENT=TRUE'
          echo "lengte sleutel: ${#KEY}"
          curl -s -o a.out -w "anoniem: %{http_code} %{content_type}\n" "https://anonymous.api.dataplatform.knmi.nl/wms/adaguc-server?$Q"; head -c 200 a.out | tr -cd '[:print:]\n'; echo
          curl -s -o k.out -w "met sleutel: %{http_code} %{content_type}\n" -H "Authorization: $KEY" "https://api.dataplatform.knmi.nl/wms/adaguc-server?$Q"; head -c 200 k.out | tr -cd '[:print:]\n'; echo
          curl -s -o c.out -w "capabilities: %{http_code}\n" "https://anonymous.api.dataplatform.knmi.nl/wms/adaguc-server?DATASET=radar_reflectivity_composites&SERVICE=WMS&REQUEST=GetCapabilities"; grep -o "<Name>[^<]*</Name>" c.out | head -8
