name: Homey-controle (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci >/dev/null
      - name: Homey-verzendingen volgen (max. 20 min, geen sleutels)
        run: |
          ID=$(npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).find(d=>d.name==="p2000-apeldoorn").uuid))')
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          q() { npx wrangler d1 execute p2000-apeldoorn --remote --json --command "$1" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s)[0].results)console.log(JSON.stringify(r))})'; }
          prev=""
          for i in $(seq 1 40); do
            R=$(q "SELECT value, datetime(at/1000,'unixepoch','+1 hour') AS t FROM kv WHERE key = 'homey_last'")
            [ "$R" != "$prev" ] && echo "homey_last: $R" && prev="$R"
            echo "$R" | grep -q '\\"ok\\":true' && exit 0
            sleep 30
          done
