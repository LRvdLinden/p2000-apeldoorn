name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 150
          curl -s "https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/waarschuwingen" | jq -c '[.[]? // .items[]? | select(.id=="burgernet:3977418")][] | {status,start,titel,startbericht:(.startbericht|.[0:60]),berichten}'
          curl -s "https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/nieuws?limit=10" | jq -c '.[] | select(.bron=="burgernet") | {id,titel,start,aantal}'
