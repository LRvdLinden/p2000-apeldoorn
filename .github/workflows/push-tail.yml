name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
permissions:
  contents: write
jobs:
  kaart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography pillow
      - env:
          KID: ${{ secrets.WEB_MAPKIT_JS_KEY_ID }}
          TID: ${{ secrets.WEB_MAPKIT_JS_TEAM_ID || secrets.APN_TEAM_ID }}
          P8: ${{ secrets.WEB_MAPKIT_JS_P8 }}
          VORMEN: '{"gemeente": [[52.27, 6.037], [52.278, 6.029], [52.274, 5.974], [52.275, 5.937], [52.266, 5.88], [52.257, 5.861], [52.27, 5.851], [52.274, 5.822], [52.269, 5.75], [52.249, 5.762], [52.244, 5.727], [52.221, 5.742], [52.21, 5.731], [52.195, 5.751], [52.198, 5.793], [52.186, 5.812], [52.178, 5.802], [52.152, 5.81], [52.15, 5.86], [52.127, 5.865], [52.107, 5.884], [52.101, 5.912], [52.1, 5.947], [52.079, 5.947], [52.074, 5.956], [52.08, 5.991], [52.075, 6.009], [52.099, 6.035], [52.125, 6.052], [52.132, 6.07], [52.145, 6.077], [52.186, 6.05], [52.202, 6.054], [52.222, 6.047], [52.24, 6.029], [52.27, 6.037]], "nlalert": [[52.2425, 5.99174], [52.24501, 5.99109], [52.24727, 5.98921], [52.24906, 5.98628], [52.25021, 5.98259], [52.25061, 5.9785], [52.25021, 5.97441], [52.24906, 5.97072], [52.24727, 5.96779], [52.24501, 5.96591], [52.2425, 5.96526], [52.23999, 5.96591], [52.23773, 5.96779], [52.23594, 5.97072], [52.23479, 5.97441], [52.23439, 5.9785], [52.23479, 5.98259], [52.23594, 5.98628], [52.23773, 5.98921], [52.23999, 5.99109], [52.2425, 5.99174]]}'
        run: |
          python3 - <<'PY'
          import os, json, math, base64, urllib.parse, urllib.request
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          from PIL import Image, ImageDraw
          key = serialization.load_pem_private_key(os.environ['P8'].encode(), None)
          V = json.loads(os.environ['VORMEN'])
          os.makedirs('out', exist_ok=True)
          A = 'https://a-alerts.nl/assets/img/'
          def world(lat, lon, z):
              s = 256 * 2 ** z; r = math.radians(lat)
              return ((lon + 180) / 360 * s, (1 - math.log(math.tan(r) + 1 / math.cos(r)) / math.pi) / 2 * s)
          cases = {
            'brandweer': dict(c=(52.18992, 5.96554), z=16, img=("marker_brandweer.png", 48, 48, "0,-22")),
            'burgernet': dict(c=(52.1950, 5.9650), z=15, img=("marker_burgernet.png", 39, 48, "0,-24")),
            'nlalert': dict(c=(52.2425, 5.9785), z=13, img=("marker_nlalert.png", 39, 48, "0,-24"), gebied=V['nlalert']),
          }
          for naam, c in cases.items():
              lat, lon = c['c']; f, w, h, off = c['img']
              # Apple centres an image annotation on its point: move the point up by half the image so the tip is on the spot.
              wx, wy = world(lat, lon, c['z']); wy -= h / 2
              s_ = 256 * 2 ** c['z']; plon = wx / s_ * 360 - 180; plat = math.degrees(math.atan(math.sinh(math.pi * (1 - 2 * wy / s_))))
              ann = [] if c.get('gebied') else [{"point": f"{plat:.6f},{plon:.6f}", "markerStyle": "img", "imgIdx": 0}]
              imgs = [{"url": A + f, "width": w, "height": h}]
              q = [('center', f'{lat},{lon}'), ('z', str(c['z'])), ('size', '600x600'), ('scale', '2'), ('colorScheme', 'light'), ('lang', 'nl-NL'),
                   ] + ([('annotations', json.dumps(ann, separators=(',', ':'))), ('imgs', json.dumps(imgs, separators=(',', ':')))] if ann else []) + [
                   ('teamId', os.environ['TID']), ('keyId', os.environ['KID'])]
              path = '/api/v1/snapshot?' + urllib.parse.urlencode(q, quote_via=urllib.parse.quote)
              r, s = decode_dss_signature(key.sign(path.encode(), ec.ECDSA(hashes.SHA256())))
              sig = base64.urlsafe_b64encode(r.to_bytes(32, 'big') + s.to_bytes(32, 'big')).decode().rstrip('=')
              try:
                  data = urllib.request.urlopen('https://snapshot.apple-mapkit.com' + path + '&signature=' + sig, timeout=20).read()
              except urllib.error.HTTPError as e:
                  print(naam, 'HTTP', e.code, e.read()[:300]); continue
              open(f'out/{naam}.png', 'wb').write(data)
              print(naam, 'ok')
          PY
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan voorbeeld-kaart4 && git rm -rq --cached . && git add -f out/*.png && git commit -qm "voorbeeld" && git push -fq origin voorbeeld-kaart4
