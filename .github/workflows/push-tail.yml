name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o k.png "https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/kaart.png?c=52.12500,5.29500&z=7.3"
          git init -q t && cd t && cp ../k.png . && git add k.png && git -c user.name=ci -c user.email=ci@x commit -qm k && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-kaart
