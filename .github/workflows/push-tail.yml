name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 90; A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$A/v1/nieuws?limit=100" | jq -r '.[] | select(.soort=="weer" or .soort=="liveblog") | "\(.soort) \(.status) \(.afbeelding)"' | head -8
          for u in $(curl -s "$A/v1/nieuws?limit=100" | jq -r '.[] | select(.soort=="weer" or .soort=="liveblog") | .afbeelding' | sort -u | head -5); do echo "IMG $(curl -s -o /dev/null -w '%{http_code} %{size_download}' "$u") $u"; done
