name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          npm ci >/dev/null 2>&1
          npx wrangler deployments list 2>&1 | tail -25
          npx wrangler versions list 2>&1 | tail -20
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s -D - -o /dev/null "$A/health?t=$RANDOM" | grep -i -E "cf-|server|date"
