name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$A/v1/nieuws?limit=100" | jq -r '.[] | select(.soort=="liveblog") | "\(.bron) \(.status) \(.afbeelding|split("/")|last)"' | sort -u | head -5
          for f in burgernet-afgerond.webp og/burgernet-afgerond.jpg; do echo "WEB $(curl -s -o /dev/null -w '%{http_code}' https://a-alerts.nl/assets/img/nieuws/$f) $f"; done
          for f in banner-amber-apeldoorn-vierkant-afgerond.png banner-pol-apeldoorn-vierkant.png knmi-green-fog-vierkant.png; do echo "BRAND $(curl -s -o /dev/null -w '%{http_code}' https://raw.githubusercontent.com/LRvdLinden/P2000-brand/main/banners/$f) $f"; done
