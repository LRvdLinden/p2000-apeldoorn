name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s
          curl -s -o vild.zip https://opendata.ndw.nu/VILD6.14.A.zip && unzip -o -q vild.zip -d vild && find vild -type f | head -30 && du -sh vild
          curl -s -o plan.xml.gz https://opendata.ndw.nu/planningsfeed_wegwerkzaamheden_en_evenementen.xml.gz
          curl -s -o actueel.xml.gz https://opendata.ndw.nu/actueel_beeld.xml.gz
          ls -la
          # keep small: the VILD files as they are (dbf/csv) if under 30 MB in total, otherwise only the list
          rm -f vild.zip
          git init -q -b ndw-samples && git add . && git -c user.name=probe -c user.email=p@p commit -qm samples
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ndw-samples
