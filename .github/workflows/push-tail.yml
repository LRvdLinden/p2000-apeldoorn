name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
permissions:
  contents: write
jobs:
  kaart:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q cryptography
      - env:
          KID: ${{ secrets.WEB_MAPKIT_JS_KEY_ID }}
          TID: ${{ secrets.WEB_MAPKIT_JS_TEAM_ID || secrets.APN_TEAM_ID }}
          P8: ${{ secrets.WEB_MAPKIT_JS_P8 }}
        run: |
          mkdir -p out && python3 - <<'PY'
          import os, base64, urllib.parse, urllib.request
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          key = serialization.load_pem_private_key(os.environ['P8'].encode(), None)
          for naam, center, z in [('knmi-gelderland', '52.10,5.92', '8.6'), ('knmi-regio', '52.20,5.95', '10')]:
              q = [('center', center), ('z', z), ('size', '600x600'), ('scale', '2'), ('colorScheme', 'light'), ('lang', 'nl-NL'), ('poi', '0'),
                   ('teamId', os.environ['TID']), ('keyId', os.environ['KID'])]
              path = '/api/v1/snapshot?' + urllib.parse.urlencode(q, quote_via=urllib.parse.quote)
              r, s = decode_dss_signature(key.sign(path.encode(), ec.ECDSA(hashes.SHA256())))
              sig = base64.urlsafe_b64encode(r.to_bytes(32, 'big') + s.to_bytes(32, 'big')).decode().rstrip('=')
              try:
                  open(f'out/{naam}.png', 'wb').write(urllib.request.urlopen('https://snapshot.apple-mapkit.com' + path + '&signature=' + sig, timeout=20).read()); print(naam, 'ok')
              except urllib.error.HTTPError as e: print(naam, 'HTTP', e.code, e.read()[:200])
          PY
      - run: |
          git init -q x && cp out/*.png x/ && cd x && git config user.name a && git config user.email a@a
          git add . && git commit -qm v && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/voorbeeld-kaart5
