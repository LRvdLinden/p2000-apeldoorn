name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60; A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$A/v1/waarschuwingen" | jq -c '[.[]? // .items[]? | select(.id=="burgernet:3977418")][] | {status,start,titel,bijgewerkt,berichten}'
          curl -s "$A/v1/status" | jq -c '.. | objects | select(.id? and (.id|tostring|test("burgernet")))' | head -c 800; echo
          curl -s "$A/v1/status" | jq -c '.versie? // .version? // empty'
