name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120; A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$A/v1/waarschuwingen" | jq -c '[.[]? // .items[]? | select(.bron=="burgernet")][:3][] | {id,status,start,einde,link,afloop:(.afloop|.[0:80]?),berichten:[.berichten[]?|{soort,at}]}'
          curl -s "$A/v1/status" | jq -c '.. | objects | select(.id?=="burgernet") | {staat,detail}'
