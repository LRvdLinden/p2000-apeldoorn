name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          sleep 5
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s -D - -o /tmp/b "$A/v1/nieuws?soort=regionaal&limit=3&t=$RANDOM" | grep -i -E "^(cf-|cache|age|date)"; head -c 400 /tmp/b; echo
          curl -s "$A/health?t=$RANDOM" | head -c 1500; echo
