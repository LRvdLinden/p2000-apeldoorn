name: API-controle (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci >/dev/null
      - name: Pushstatus (geen tokens of sleutels)
        run: |
          ID=$(npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).find(d=>d.name==="p2000-apeldoorn").uuid))')
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          q() { npx wrangler d1 execute p2000-apeldoorn --remote --json --command "$1" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s)[0].results)console.log(JSON.stringify(r))})'; }
          echo "--- per 10 min (laatste 2 uur)"; q "SELECT datetime(bucket/1000,'unixepoch','+1 hour') AS tijd, platform, ok, fail FROM status_push WHERE bucket > (strftime('%s','now')-7200)*1000 ORDER BY bucket"
          echo "--- laatste fout"; q "SELECT value FROM kv WHERE key = 'push_laatste_fout'"
          echo "--- wachtrij"; q "SELECT substr(guid,1,12) AS soort, COUNT(*) AS n FROM outbox GROUP BY 1"
          echo "--- toestellen"; q "SELECT platform, environment, COUNT(*) AS n FROM devices GROUP BY 1,2"
