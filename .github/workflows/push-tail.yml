name: API-controle (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          echo "radar: $(curl -s $B/v1/radar)"
          echo "feedback onbekende melding: $(curl -s -o /dev/null -w '%{http_code}' -X POST $B/v1/meldingen/onbestaand123/feedback -H content-type:application/json -d '{"reden":"anders"}')"
          echo "feedback zonder reden: $(curl -s -X POST $B/v1/meldingen/onbestaand123/feedback -H content-type:application/json -d '{}')"
          echo "helikopters: $(curl -s $B/v1/helikopters | head -c 400)"
          echo "changelog: $(curl -s $B/v1/changelog | head -c 300)"
          echo "beheer feedback zonder login: $(curl -s -o /dev/null -w '%{http_code}' $B/v1/beheer/feedback)"
          echo "health: $(curl -s $B/v1/status | head -c 300)"
