name: Push tail (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci >/dev/null
      - name: Testpush naar recente toestellen (alleen status, geen tokens)
        run: |
          ID=$(npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).find(d=>d.name==="p2000-apeldoorn").uuid))')
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute p2000-apeldoorn --remote --json --command "SELECT token, platform, environment, app_version, enabled, updated_at FROM devices ORDER BY updated_at DESC LIMIT 12" 2>/dev/null > /tmp/d.json
          node -e '
            const rows=JSON.parse(require("fs").readFileSync("/tmp/d.json","utf8"))[0].results;
            (async()=>{for(const r of rows){
              const kort=r.token.replace(/^(fcm:)?(.{6}).*/,"$1$2…");
              const t=typeof r.updated_at==="number"?(r.updated_at<1e12?r.updated_at*1000:r.updated_at):Date.parse(r.updated_at);const recent=Date.now()-t<3*3600e3;r.updated_at=new Date(t).toISOString();
              let res="(niet getest)";
              if(recent){const x=await fetch("https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/devices/"+encodeURIComponent(r.token)+"/test",{method:"POST"});res=x.status+" "+(await x.text()).slice(0,200);}
              console.log(kort,r.platform,r.environment,r.app_version,"enabled="+r.enabled,r.updated_at,"→",res);
            }})();'
