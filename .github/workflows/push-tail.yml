name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -A "Mozilla/5.0" https://www.burgernet.nl/gemeente/Oost-Nederland/APELDOORN > g.html
          curl -s -A "Mozilla/5.0" https://www.burgernet.nl/burgernet/3977418 > a.html
          echo "== gemeente links"; grep -o -E '(href|data-[a-z-]*)="[^"]*(burgernet|actie|action)[^"]*"' g.html | sort | uniq -c | head -30
          grep -o -E '3977418|397[0-9]{4}' g.html | head; grep -o -E 'api[^"'"'"' ]{0,120}' g.html | sort -u | head -15
          echo "== actie"; python3 - <<'P'
          import re;h=open('a.html').read()
          i=h.find('Startbericht');print(h[i-1500:i+2500])
          for k in ['Start actie','Einde actie','Locatie','Status van deze actie','data-center','<h1']:
              j=h.find(k);print('##',k,j,repr(h[j-50:j+250]) if j>=0 else '')
          P
