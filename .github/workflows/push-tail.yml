name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          for i in 1 2 3; do curl -s -o /dev/null -w "API nieuws %{http_code} %{time_total}s %{size_download}B\n" "$A/v1/nieuws?limit=100"; done
          curl -s -o /dev/null -w "API nieuws limit30 %{time_total}s %{size_download}B\n" "$A/v1/nieuws?limit=30"
          npm i -s playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > p.js <<'J'
          const { chromium } = require('playwright');
          (async () => { const b = await chromium.launch(); const p = await b.newPage();
            const t0 = Date.now(); const reqs = [];
            p.on('requestfinished', async r => { const s = await r.sizes().catch(()=>({responseBodySize:0})); const tm = r.timing(); reqs.push([Math.round(tm.responseEnd), s.responseBodySize, r.url().slice(0,110)]); });
            await p.goto('https://a-alerts.nl/nieuws/', { waitUntil: 'load' }); console.log('load', Date.now()-t0, 'ms');
            await p.waitForSelector('.nw-kaart, .nw-hero, article, .nw-rij', { timeout: 60000 }).catch(e=>console.log('geen kaarten', e.message));
            console.log('eerste artikel zichtbaar', Date.now()-t0, 'ms');
            await p.waitForLoadState('networkidle').catch(()=>{}); console.log('networkidle', Date.now()-t0, 'ms');
            reqs.sort((a,b)=>b[0]-a[0]); console.log('traagste:'); reqs.slice(0,12).forEach(r=>console.log(' ', r.join(' | ')));
            const tot = reqs.reduce((s,r)=>s+r[1],0); console.log('totaal', reqs.length, 'requests', Math.round(tot/1024), 'KB');
            const big = [...reqs].sort((a,b)=>b[1]-a[1]).slice(0,8); console.log('grootste:'); big.forEach(r=>console.log(' ', r.join(' | ')));
            await b.close(); })();
          J
          node p.js
