name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s https://opendata.ndw.nu/ | grep -o 'href="[^"]*"[^<]*</a>[^<]*' | sed 's/<\/a>//' | head -80
          echo "== srti"; curl -s https://opendata.ndw.nu/srti.xml.gz | gunzip | head -c 1500; echo
          echo "== incidents"; curl -s https://opendata.ndw.nu/incidents.xml.gz | gunzip | grep -o "<[a-zA-Z:]*situationRecord [^>]*>" | sed 's/ id=.*//' | sort | uniq -c | head
          echo "== srti types"; curl -s https://opendata.ndw.nu/srti.xml.gz | gunzip | grep -o 'xsi:type="[^"]*"' | sort | uniq -c | head -20
          echo "== statusberichten types"; curl -s https://opendata.ndw.nu/actuele_statusberichten.xml.gz | gunzip | grep -o 'xsi:type="[^"]*"' | sort | uniq -c | head -20
