name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      WID: ${{ secrets.HOMEY_WEBHOOK_ID }}
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          M=$(curl -s "$A/v1/meldingen/f0a96819-31b1-e52a-1f7e-d6fbd718bf39")
          echo "melding bytes: $(echo "$M" | wc -c)"; echo "$M" | jq -c 'to_entries | map({k:.key, n:(.value|tostring|length)}) | sort_by(-.n) | .[:8]'
          for body in '{"channel":"aalerts","sent_at":"x","meldingen":[],"waarschuwingen":[]}' "$(jq -nc --argjson m "$(echo "$M" | jq -c '.melding // .')" '{channel:"aalerts",sent_at:"x",meldingen:[$m],waarschuwingen:[]}')"; do
            echo "== POST $(echo "$body" | wc -c) bytes"
            curl -s -o r.txt -w "%{http_code}\n" -X POST -H "content-type: application/json" --data "$body" "https://webhooks.athom.com/webhook/$WID"; head -c 300 r.txt; echo
          done
