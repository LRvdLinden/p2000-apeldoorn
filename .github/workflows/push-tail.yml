name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$A/v1/nieuws?limit=25" | jq -r '.[] | select(.soort=="regionaal" or .soort=="politie") | "\(.soort) \(.categorie) \(.afbeelding|split("/")|last|split("?")|first) \(.foto_bron)"' | head -14
          echo "JS $(curl -s -o /dev/null -w '%{http_code}' https://a-alerts.nl/assets/img/nieuws/js-brand-1.webp)"
