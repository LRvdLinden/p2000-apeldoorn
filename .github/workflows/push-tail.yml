name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          for i in 1 2 3 4 5 6 7 8; do
            s=$(curl -s "$A/health?t=$RANDOM" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d.get('nieuws112')) if 'nieuws112' in d else 'OUD')")
            echo "$i $s"; case "$s" in null|OUD) sleep 45;; *) break;; esac
          done
          curl -s "$A/v1/nieuws?soort=regionaal&limit=30&t=$RANDOM" | python3 -c "
          import json,sys;d=json.load(sys.stdin);print(len(d))
          for x in d: print(x['at'][:16],x.get('plaats'),x.get('categorie'),x['afbeelding'].split('/')[-1],'|',x['titel'][:60],'|',(x.get('intro') or '')[:50])"
          ID=$(curl -s "$A/v1/nieuws?soort=regionaal&limit=1" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0]['id'] if d else '')"); [ -n "$ID" ] && curl -s "$A/v1/nieuws/$ID" | head -c 700; echo
