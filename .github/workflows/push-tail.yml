name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env: { U: "${{ secrets.VERKEER_URL }}" }
        run: |
          echo "koyeb: $(curl -s -m 60 "$U/health")"
          sleep 70
          curl -s "https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/verkeer" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);console.log("API items",d.items.length,"gepland",(d.gepland||[]).length,"flitsers",d.flitsers.length);for(const i of d.items)console.log("  ",i.soort,"|",i.kop||"-","|",i.titel,"|",i.traject||"-","|",i.oorzaak||"-")})'
