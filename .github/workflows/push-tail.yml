name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q='[out:json][timeout:25];node["highway"="speed_camera"](52.05,5.75,52.33,6.15);out body;'
          for s in https://overpass-api.de/api/interpreter https://lz4.overpass-api.de/api/interpreter https://z.overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do echo "== $s"; curl -s -m 60 -w '\n%{http_code} %{time_total}\n' --data-urlencode "data=$Q" "$s" | tail -c 600; done
