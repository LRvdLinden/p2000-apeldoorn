name: Push tail (tijdelijk)
on: workflow_dispatch
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci >/dev/null
      - name: Logs van de worker (10 min, alleen /v1/devices en push)
        run: |
          timeout 600 npx wrangler tail p2000-apeldoorn-api --format json 2>/dev/null | node -e '
            const rl=require("readline").createInterface({input:process.stdin});
            const kort=(s)=>String(s).replace(/(devices\/)(fcm(%3A|:))?([A-Za-z0-9_-]{6})[A-Za-z0-9_:%-]*/i,"$1$2$4…");
            rl.on("line",(l)=>{try{const e=JSON.parse(l);const r=e.event&&e.event.request;const url=r?new URL(r.url).pathname:"(cron)";
              const logs=(e.logs||[]).map(x=>x.message.join(" ")).filter(m=>/push|fcm|apns|device|test/i.test(m));
              if(/\/v1\/devices/.test(url)||logs.length||(e.exceptions||[]).length){
                console.log(new Date(e.eventTimestamp).toISOString().slice(11,19), r?r.method:"", kort(url), e.event&&e.event.response?e.event.response.status:"", e.outcome, logs.map(kort).join(" | "), (e.exceptions||[]).map(x=>x.message).join(" | "));
              }}catch{}});' || true
