name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          echo "== health"; curl -s $A/health | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('nieuws'))"
          echo "== lijst"; curl -s "$A/v1/nieuws?limit=60" | python3 -c "
          import json,sys;d=json.load(sys.stdin);print(len(d))
          for x in d[:40]: print(x['soort'],x['bron'],x['at'][:16],x.get('plaats'),x.get('categorie'),'|',x['titel'][:90])"
          echo "== raw politie"; curl -s -H 'accept: application/json' "https://api.politie.nl/v4/nieuws?language=nl&lat=52.2112&lon=5.9699&radius=25&maxnumberofitems=25" | python3 -c "
          import json,sys;d=json.load(sys.stdin);n=d.get('nieuwsberichten',[]);print('n',len(n),'iterator',d.get('iterator'))
          if n: print(sorted(n[0].keys())); print({k:(str(v)[:120]) for k,v in n[0].items() if k not in ('alineas',)}); print(str(n[0].get('alineas'))[:400])
          for x in n: print(x.get('publicatiedatum'),'|',x.get('gebied'),'|',x.get('titel')[:80])"
          echo "== one"; ID=$(curl -s "$A/v1/nieuws?soort=politie&limit=1" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0]['id'] if d else '')"); [ -n "$ID" ] && curl -s "$A/v1/nieuws/$ID" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d,ensure_ascii=False)[:1500])"
          echo "== img"; curl -s -o /dev/null -w "%{http_code}\n" https://a-alerts.nl/assets/img/nieuws/politie-verkeer.webp
