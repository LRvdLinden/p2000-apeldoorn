name: Voorbeelddata (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$B/v1/meldingen?limit=300" > meldingen.json
          curl -s "$B/v1/waarschuwingen?days=30" > waarschuwingen.json
          ls -la *.json
      - uses: actions/upload-artifact@v4
        with: { name: voorbeelden, path: "*.json", retention-days: 1 }
