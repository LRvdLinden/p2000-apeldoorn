name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60; A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$A/v1/nieuws?limit=100" | jq -r '.[] | select(.soort!="politie" and .soort!="regionaal") | "\(.soort) \(.bron) live=\(.liveblog) \(.afbeelding|split("/")|last)"' | head -10
          echo "liveblog-filter: $(curl -s "$A/v1/nieuws?soort=liveblog" | jq length)"
