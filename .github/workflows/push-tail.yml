name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env: { U: "${{ secrets.VERKEER_URL }}", T: "${{ secrets.VERKEER_TOKEN }}", U2: "${{ vars.VERKEER_URL }}" }
        run: echo "url-lengte ${#U} token-lengte ${#T} variabele-url-lengte ${#U2}"
