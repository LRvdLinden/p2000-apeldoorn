name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      WID: ${{ secrets.HOMEY_WEBHOOK_ID }}
    steps:
      - run: |
          B='{"channel":"aalerts","sent_at":"probe","meldingen":[],"waarschuwingen":[]}'
          t() { echo "== $1"; curl -s -o r.txt -w "%{http_code} " "${@:2}"; head -c 200 r.txt; echo; }
          t "query"  -X POST -H "content-type: application/json" --data "$B" "https://webhooks.athom.com/webhook/$WID?channel=aalerts"
          t "header" -X POST -H "content-type: application/json" -H "channel: aalerts" --data "$B" "https://webhooks.athom.com/webhook/$WID"
          t "nested body" -X POST -H "content-type: application/json" --data '{"body":{"channel":"aalerts"},"channel":"aalerts"}' "https://webhooks.athom.com/webhook/$WID"
          t "form" -X POST --data "channel=aalerts" "https://webhooks.athom.com/webhook/$WID"
          t "GET query" "https://webhooks.athom.com/webhook/$WID?channel=aalerts"
