name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > get.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const ids = process.argv.slice(2);
          const b = await chromium.launch({ headless: true, args: ["--disable-blink-features=AutomationControlled"] });
          const ctx = await b.newContext({ locale: "nl-NL", userAgent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36", viewport: { width: 1366, height: 900 } });
          const p = await ctx.newPage();
          for (const slug of ids) {
            const id = slug.split("-").pop();
            try {
              await p.goto(`https://pixabay.com/nl/photos/${slug}/`, { waitUntil: "domcontentloaded", timeout: 45000 });
              for (let i = 0; i < 12 && !(await p.$('meta[property="og:image"]')); i++) await p.waitForTimeout(1500);
              const og = await p.$eval('meta[property="og:image"]', (m) => m.content).catch(() => null);
              const html = await p.content();
              const big = (html.match(/https:\/\/cdn\.pixabay\.com\/photo\/[^"' ]*_1280\.(jpg|png)/) || [])[0];
              const url = big || og;
              console.log(id, "->", url || "NIETS", "title:", (await p.title()).slice(0, 80));
              if (url) { const r = await p.request.get(url, { headers: { referer: "https://pixabay.com/" } }); if (r.ok()) fs.writeFileSync(`${id}.jpg`, await r.body()); console.log("  img", r.status()); }
            } catch (e) { console.log(id, "fout", e.message.slice(0, 100)); }
          }
          await b.close();
          JS
          node get.mjs politie-blauw-agent-mensen-1355511 politie-blauw-agent-mensen-1355512 politie-straat-stoep-wandelen-6934151 politieagent-uniform-stedelijk-stad-6944918 politie-officieren-veiligheid-gezag-4331483 op-het-lichaam-gedragen-794099 mens-persoon-menselijk-politie-2460186 politie-voertuig-straat-mensen-5818163 politie-copenhagen-veilig-4806045 \
            helikopter-vliegend-lucht-8023696
          rm -rf node_modules package*.json get.mjs; ls -la
          ls *.jpg >/dev/null 2>&1 || exit 0
          git config --global user.email "actions@github.com"; git config --global user.name "probe"
          git init -q && git checkout -q -b pixabay-stock && git add . && git commit -qm "Pixabay kandidaten" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pixabay-stock && echo gepusht
