name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          echo "== status"; curl -s $A/v1/status | python3 -c "import json,sys;d=json.load(sys.stdin);print([ (o.get('id'),o.get('staat'),o.get('detail')) for g in d.get('groepen',[]) for o in g.get('onderdelen',[]) if o.get('id') in ('kind','burgernet','nlalert')])" || true
          echo "== lijst"; curl -s "$A/v1/waarschuwingen?days=14&kind=1" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d), sorted(set(w['bron'] for w in d)))"
          echo "== oud"; curl -s "$A/v1/waarschuwingen?days=14" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d), sorted(set(w['bron'] for w in d)))"
          echo "== kaart"; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" "$A/v1/kaart.png?c=52.2108,5.9737&z=13&m=vermistkind"
          echo "== site"; for u in pager/ assets/img/icon_amber.png assets/img/marker_vermistkind.png deel/amber.html; do curl -s -o /dev/null -w "$u %{http_code}\n" https://a-alerts.nl/$u; done
          curl -s -o /dev/null -w "share %{http_code}\n" "https://a-alerts.nl/waarschuwing/amber:123"
          curl -s "https://a-alerts.nl/waarschuwing/amber:123" | grep -o 'og:image" content="[^"]*'
