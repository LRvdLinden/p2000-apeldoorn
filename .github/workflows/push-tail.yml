name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            echo "=== test $i JSON"; curl -s -H "Accept: application/json" https://services.burgernet.nl/landactiehost/api/test/alerts | head -c 3000; echo
            echo "=== test $i XML"; curl -s https://services.burgernet.nl/landactiehost/api/test/alerts | head -c 2500; echo
            sleep 125
          done
          echo "=== live"; curl -s -H "Accept: application/json" -w "\nHTTP %{http_code}\n" https://services.burgernet.nl/landactiehost/api/v1/alerts | head -c 2000
