name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s; cd s
          for f in actueel_beeld.xml.gz veiligheidsgerelateerde_informatie_srti.xml.gz tijdelijke_verkeersmaatregelen_afsluitingen.xml.gz trafficspeed.xml.gz snelheden_en_intensiteiten_configuratie_meetlocaties.xml.gz traveltime.xml.gz reistijden_configuratie_meetlocaties.xml.gz; do curl -s -o $f https://opendata.ndw.nu/$f; echo "$f $(stat -c%s $f)"; done
          curl -sI https://opendata.ndw.nu/actueel_beeld.xml.gz | grep -iE "last-mod|etag|cache"
      - uses: actions/upload-artifact@v4
        with: { name: ndw, path: s }
