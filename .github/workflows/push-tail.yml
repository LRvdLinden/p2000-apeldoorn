name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
permissions:
  contents: write
jobs:
  kaart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography pillow
      - env:
          KID: ${{ secrets.WEB_MAPKIT_JS_KEY_ID }}
          TID: ${{ secrets.WEB_MAPKIT_JS_TEAM_ID || secrets.APN_TEAM_ID }}
          P8: ${{ secrets.WEB_MAPKIT_JS_P8 }}
          VORMEN: '{"gemeente": [[52.27, 6.037], [52.278, 6.029], [52.274, 5.974], [52.275, 5.937], [52.266, 5.88], [52.257, 5.861], [52.27, 5.851], [52.274, 5.822], [52.269, 5.75], [52.249, 5.762], [52.244, 5.727], [52.221, 5.742], [52.21, 5.731], [52.195, 5.751], [52.198, 5.793], [52.186, 5.812], [52.178, 5.802], [52.152, 5.81], [52.15, 5.86], [52.127, 5.865], [52.107, 5.884], [52.101, 5.912], [52.1, 5.947], [52.079, 5.947], [52.074, 5.956], [52.08, 5.991], [52.075, 6.009], [52.099, 6.035], [52.125, 6.052], [52.132, 6.07], [52.145, 6.077], [52.186, 6.05], [52.202, 6.054], [52.222, 6.047], [52.24, 6.029], [52.27, 6.037]], "nlalert": [[52.2425, 5.99174], [52.24501, 5.99109], [52.24727, 5.98921], [52.24906, 5.98628], [52.25021, 5.98259], [52.25061, 5.9785], [52.25021, 5.97441], [52.24906, 5.97072], [52.24727, 5.96779], [52.24501, 5.96591], [52.2425, 5.96526], [52.23999, 5.96591], [52.23773, 5.96779], [52.23594, 5.97072], [52.23479, 5.97441], [52.23439, 5.9785], [52.23479, 5.98259], [52.23594, 5.98628], [52.23773, 5.98921], [52.23999, 5.99109], [52.2425, 5.99174]]}'
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.parse, urllib.request
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          from PIL import Image
          key = serialization.load_pem_private_key(os.environ['P8'].encode(), None)
          V = json.loads(os.environ['VORMEN'])
          os.makedirs('out', exist_ok=True)
          A = 'https://a-alerts.nl/assets/img/'
          def ring(pts, kleur): return {"points": [f"{a},{b}" for a, b in pts], "strokeColor": kleur, "lineWidth": 3}
          cases = {
            'brandweer': dict(center='52.18992,5.96554', z='16', ann=[{"point": "52.18992,5.96554", "markerStyle": "img", "imgIdx": 0, "offset": "0,-24"}], imgs=[{"url": A + "marker_brandweer.png", "width": 48, "height": 48}]),
            'burgernet': dict(center='52.1950,5.9650', z='14', ann=[{"point": "52.1950,5.9650", "markerStyle": "img", "imgIdx": 0, "offset": "0,-24"}], imgs=[{"url": A + "marker_burgernet.png", "width": 48, "height": 48}]),
            'nlalert': dict(center='52.2425,5.9785', z='13', ann=[{"point": "52.2425,5.9785", "markerStyle": "img", "imgIdx": 0, "offset": "0,-24"}], imgs=[{"url": A + "marker_nlalert.png", "width": 48, "height": 48}], overlays=[ring(V['nlalert'], 'E3001B')]),
            'knmi': dict(center='52.176,5.902', spn='0.26,0.42', ann=[{"point": "52.2108,5.9737", "markerStyle": "img", "imgIdx": 0}], imgs=[{"url": A + "icon_knmi.png", "width": 44, "height": 44}], overlays=[ring(V['gemeente'], 'F7C600')]),
          }
          for naam, c in cases.items():
              q = [('center', c['center'])] + ([('z', c['z'])] if 'z' in c else [('spn', c['spn'])]) + [('size', '600x600'), ('scale', '2'), ('colorScheme', 'light'), ('lang', 'nl-NL'),
                   ('annotations', json.dumps(c['ann'], separators=(',', ':'))), ('imgs', json.dumps(c['imgs'], separators=(',', ':')))]
              if c.get('overlays'): q.append(('overlays', json.dumps(c['overlays'], separators=(',', ':'))))
              q += [('teamId', os.environ['TID']), ('keyId', os.environ['KID'])]
              path = '/api/v1/snapshot?' + urllib.parse.urlencode(q, quote_via=urllib.parse.quote)
              r, s = decode_dss_signature(key.sign(path.encode(), ec.ECDSA(hashes.SHA256())))
              sig = base64.urlsafe_b64encode(r.to_bytes(32, 'big') + s.to_bytes(32, 'big')).decode().rstrip('=')
              try:
                  data = urllib.request.urlopen('https://snapshot.apple-mapkit.com' + path + '&signature=' + sig, timeout=20).read()
              except urllib.error.HTTPError as e:
                  print(naam, 'HTTP', e.code, e.read()[:300]); continue
              open(f'out/{naam}.png', 'wb').write(data)
              im = Image.open(f'out/{naam}.png').convert('RGBA'); print(naam, im.size, len(path))
              wm = Image.open('website/assets/img/kaart-watermerk.png').convert('RGBA')
              f = im.width / 600
              wm = wm.resize((round(130 * f), round(34 * f)), Image.LANCZOS)
              im.alpha_composite(wm, (round(14 * f), round(14 * f)))
              im.convert('RGB').save(f'out/{naam}-voorbeeld.jpg', quality=88)
          PY
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan voorbeeld-kaart2 && git rm -rq --cached . && git add -f out/*.jpg && git commit -qm "voorbeeld" && git push -fq origin voorbeeld-kaart2
