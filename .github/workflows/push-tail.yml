name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          cat > v.py <<'P'
          import json, time, urllib.request
          def get(u, ua):
              t=time.time()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u, headers={"user-agent":ua,"accept":"application/json"}), timeout=20)
                  b=r.read(); return json.loads(b), round(time.time()-t,2), r.status, len(b)
              except Exception as e: return None, round(time.time()-t,2), str(e)[:60], 0
          UA="A-Alerts/1.0 (+https://a-alerts.nl)"
          seen={"bn":{}, "mk":{}}
          for i in range(26):
              bn, tb, sb, nb = get("https://www.burgernet.nl/active", UA)
              mk, tm, sm, nm = get("https://api.112meldkamer.nl/v1/burgernet", UA)
              now=time.strftime("%H:%M:%S")
              for k,d in (("bn",bn),("mk",mk)):
                  for a in (d or []):
                      key=a["link"].split("/")[-1]
                      if key not in seen[k]: seen[k][key]=(now,a.get("location"),a.get("date"),a.get("time"),a.get("isClosed","-"))
              print(now, "burgernet", sb, tb, "s", len(bn or []), "items |", "112mk", sm, tm, "s", len(mk or []), "items", flush=True)
              if i==0:
                  print("BN velden:", sorted({k for a in (bn or []) for k in a}))
                  print("MK velden:", sorted({k for a in (mk or []) for k in a}))
                  print("BN zonder tijd:", sum(1 for a in (bn or []) if not a.get("time")), "MK zonder tijd:", sum(1 for a in (mk or []) if not a.get("time")))
                  print("MK isClosed true:", sum(1 for a in (mk or []) if a.get("isClosed") is True))
              time.sleep(30)
          b=set(seen["bn"]); m=set(seen["mk"])
          print("alleen burgernet:", [seen["bn"][x] for x in sorted(b-m)][:15])
          print("alleen 112mk:", [seen["mk"][x] for x in sorted(m-b)][:15])
          late=[(x, seen["bn"][x][0], seen["mk"][x][0]) for x in sorted(b&m) if seen["bn"][x][0]!=seen["mk"][x][0]]
          print("verschil eerst gezien (id, burgernet, 112mk):", late)
          print("beide:", len(b&m))
          P
          python3 v.py
          echo "== headers"; curl -sI -A "A-Alerts/1.0" https://www.burgernet.nl/active | grep -iE "^(HTTP|cache|age|cf-|server|x-)" 
          echo "== robots"; curl -s https://www.burgernet.nl/robots.txt | head -30
