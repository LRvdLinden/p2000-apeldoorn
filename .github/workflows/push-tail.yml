name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: |
          set +e
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          for i in $(seq 1 30); do
            s=$(curl -s "$A/health?t=$RANDOM" | python3 -c "import json,sys;d=json.load(sys.stdin);print('NIEUW' if 'nieuws112' in d else 'OUD')")
            echo "$(date +%H:%M) $s"; [ "$s" = NIEUW ] && break; sleep 60
          done
          sleep 150
          curl -s "$A/health?t=$RANDOM" | python3 -c "import json,sys;d=json.load(sys.stdin);print('112',json.dumps(d.get('nieuws112'))[:600])"
          curl -s "$A/v1/nieuws?soort=regionaal&limit=30&t=$RANDOM" | python3 -c "
          import json,sys;d=json.load(sys.stdin);print(len(d))
          for x in d: print(x['at'][:16],x.get('plaats'),x.get('categorie'),x['afbeelding'].split('/')[-1],'|',x['titel'][:60],'|',(x.get('intro') or '')[:50])"
