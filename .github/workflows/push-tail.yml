name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          curl -s "$A/v1/nieuws?soort=weer&limit=5" | jq -c '.[] | {id,titel,status}'
          ID=$(curl -s "$A/v1/nieuws?soort=weer&limit=1" | jq -r '.[0].id')
          curl -s "$A/v1/nieuws/$ID" | jq -c '.weer | {kop,code,tijdvak,datumKop,vanafTot,uitgifte,adviezen,gebieden:(.gebieden|length), punten:([.gebieden[].gebied[]?|length]|add)}'
          curl -s "$A/v1/nieuws/$ID" | wc -c
