name: Probe
on: { push: { branches: [a-alerts], paths: [".github/workflows/push-tail.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/nieuws?limit=40" | jq -r '.[] | select(.soort=="regionaal") | "\(.afbeelding) \(.foto_bron)"' | head -15
          for u in $(curl -s "https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/nieuws?limit=40" | jq -r '.[] | select(.foto_bron!=null) | .afbeelding' | sort -u); do echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u")"; done
          curl -s -o /dev/null -w 'site js-brand: %{http_code} %{content_type}\n' https://a-alerts.nl/assets/img/nieuws/js-brand-1.webp
