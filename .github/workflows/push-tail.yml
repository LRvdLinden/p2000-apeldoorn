name: probe
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-tail.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          mkdir out && cd out
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > get.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const b = await chromium.launch({ headless: true, args: ["--disable-blink-features=AutomationControlled"] });
          const ctx = await b.newContext({ locale: "nl-NL", userAgent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36", viewport: { width: 1366, height: 900 } });
          const p = await ctx.newPage();
          for (const slug of process.argv.slice(2)) {
            const id = slug.split("-").pop();
            for (let poging = 0; poging < 3 && !fs.existsSync(`${id}.jpg`); poging++) {
              try {
                await p.goto(`https://pixabay.com/nl/photos/${slug}/`, { waitUntil: "domcontentloaded", timeout: 45000 });
                for (let i = 0; i < 14 && !(await p.$('meta[property="og:image"]')); i++) await p.waitForTimeout(1500);
                const html = await p.content();
                const url = (html.match(/https:\/\/cdn\.pixabay\.com\/photo\/[^"' ]*_1280\.(jpg|png)/) || [])[0] || await p.$eval('meta[property="og:image"]', (m) => m.content).catch(() => null);
                const lic = /Pixabay[- ]licentie|Content License|Inhoudslicentie/i.test(html);
                console.log(id, url || "NIETS", "licentie-tekst:", lic);
                if (url) { const r = await p.request.get(url, { headers: { referer: "https://pixabay.com/" } }); if (r.ok()) fs.writeFileSync(`${id}.jpg`, await r.body()); }
              } catch (e) { console.log(id, "fout", e.message.slice(0, 80)); }
            }
          }
          await b.close();
          JS
          node get.mjs politie-voertuig-straat-zuidplas-3676913 politie-voertuig-3676917 politie-veiligheid-fietsen-bewakers-6783164 nederland-politie-motorfietsen-111240 politie-heren-paarden-monochroom-6924159 blauw-licht-politie-politie-auto-4694846 menigte-amsterdam-koningsdag-feest-6852029 ambulance-noodgeval-voertuig-redden-3676918 ambulance-spoed-levens-mens-4666213 ambulance-geel-trauma-paramedicus-1580712 helikopter-luchtvaartuig-vliegen-3299663 brandweer-hulpdiensten-brand-5309465 brandweer-auto-brandweerauto-2518942 brandweerwagen-voertuig-motor-7110895 brandweer-amsterdam-hoogwerker-4873158
          rm -rf node_modules package*.json get.mjs; ls -la
          git config --global user.email "actions@github.com"; git config --global user.name "probe"
          git init -q && git checkout -q -b pixabay-nl && git add . && git commit -qm "Pixabay NL" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pixabay-nl && echo gepusht
