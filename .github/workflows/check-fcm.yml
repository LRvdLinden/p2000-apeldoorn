name: Check FCM (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/check-fcm.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pyjwt cryptography requests
      - name: Serviceaccount testen (alleen een OAuth-token ophalen, er wordt niets verstuurd)
        env:
          SA: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, time, jwt, requests
          sa = json.loads(os.environ["SA"])
          gs = json.loads(os.environ["GSJ"])
          print("serviceaccount project:", sa.get("project_id"), "| type:", sa.get("type"), "| e-mail eindigt op:", sa.get("client_email","").split("@")[-1])
          print("google-services project:", gs["project_info"]["project_id"], "| pakketten:", [c["client_info"]["android_client_info"]["package_name"] for c in gs["client"]])
          assert sa["project_id"] == gs["project_info"]["project_id"], "Projecten verschillen!"
          now = int(time.time())
          a = jwt.encode({"iss": sa["client_email"], "scope": "https://www.googleapis.com/auth/firebase.messaging",
                          "aud": "https://oauth2.googleapis.com/token", "iat": now, "exp": now + 600}, sa["private_key"], algorithm="RS256")
          r = requests.post("https://oauth2.googleapis.com/token", data={"grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer", "assertion": a})
          print("OAuth:", r.status_code, "OK" if r.ok else r.text[:200])
          tok = r.json()["access_token"]
          # Dry run (validate_only) naar een nep-token: test dat de FCM v1 API aan staat en de sleutel rechten heeft.
          m = requests.post(f"https://fcm.googleapis.com/v1/projects/{sa['project_id']}/messages:send", headers={"authorization": f"Bearer {tok}"},
                            json={"validate_only": True, "message": {"token": "x" * 140, "data": {"t": "1"}}})
          err = m.json().get("error", {})
          print("FCM API:", m.status_code, err.get("status"), [d.get("errorCode") for d in err.get("details", [])])
          assert m.status_code != 403, "FCM API staat uit of de sleutel heeft geen rechten"
          print("ALLES IN ORDE" if m.status_code in (200, 400, 404) else "ONBEKEND")
          PY
