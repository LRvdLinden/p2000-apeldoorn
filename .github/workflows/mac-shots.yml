name: Mac screenshots

# Only the Mac app: pager, alert, warning and statistics in nl and en, each in a fresh app instance
# (no restored window state). Result on branch screenshots-mac.

on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/mac-shots.yml']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      API: https://p2000-apeldoorn-api.lrvdlinden.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build (Debug)
        run: xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "P2000 Apeldoorn" -configuration Debug -destination "platform=macOS" -derivedDataPath buildmac CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u
      - name: Live data
        id: data
        run: |
          curl -sS "$API/v1/meldingen?limit=80" -o m.json
          curl -sS "$API/v1/waarschuwingen?days=14" -o w.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open("m.json")); w=json.load(open("w.json"))
          def ok(x): return x.get("locatie") and x.get("lat") is not None and str(x.get("prioriteit","")).upper() not in ("B1","B2","B3")
          pref=[x for x in m if ok(x) and x["dienst"]=="brandweer"] or [x for x in m if ok(x)] or m
          print("guid="+pref[0]["guid"])
          ws=[x for x in w if x["bron"] in ("burgernet","nlalert")]
          print("wid="+(ws[0]["id"] if ws else ""))
          PY
      - name: Screenshots
        run: |
          defaults write -g NSQuitAlwaysKeepsWindows -bool false || true
          system_profiler SPDisplaysDataType | grep -i resolution || true
          cat > /tmp/win.swift <<'SW'
          import Cocoa
          let bid = CommandLine.arguments[1]
          let pids = NSRunningApplication.runningApplications(withBundleIdentifier: bid).map { $0.processIdentifier }
          let list = (CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]]) ?? []
          let mine = list.filter { pids.contains(($0[kCGWindowOwnerPID as String] as? Int32) ?? -1) && (($0[kCGWindowLayer as String] as? Int) ?? 1) == 0 }
            .sorted { (($0[kCGWindowBounds as String] as? [String: Double])?["Width"] ?? 0) > (($1[kCGWindowBounds as String] as? [String: Double])?["Width"] ?? 0) }
          for w in mine where ((w[kCGWindowBounds as String] as? [String: Double])?["Height"] ?? 0) > 100 { print(w[kCGWindowNumber as String] ?? "", "Height = \(Int((w[kCGWindowBounds as String] as? [String: Double])?["Height"] ?? 0))") }
          SW
          screencapture -x -R0,0,1440,900 shots-desktop.png || true
          MACAPP="$PWD/$(find buildmac/Build/Products -name "P2000 Apeldoorn.app" -maxdepth 3 | head -1)"
          BIN="$MACAPP/Contents/MacOS/P2000 Apeldoorn"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$MACAPP/Contents/Info.plist")
          GUID="${{ steps.data.outputs.guid }}"; WID="${{ steps.data.outputs.wid }}"
          mkdir -p shots
          snap() { # lang name wait args...
            LANG=$1; NAME=$2; W=$3; shift 3
            mkdir -p "shots/$LANG"
            rm -rf ~/Library/Saved\ Application\ State/"$BID".savedState ~/Library/Containers/"$BID"/Data/Library/Saved\ Application\ State 2>/dev/null || true
            open -n -F -a "$MACAPP" --args -AppleLanguages "($LANG)" -AppleLocale $([ $LANG = nl ] && echo nl_NL || echo en_US) -AAlertsScreenshots -ApplePersistenceIgnoreState YES "$@"
            sleep 6
            osascript -e "tell application id \"$BID\" to activate" || true
            sleep 1
            # No window after launch (state restoration): open one with Cmd-N.
            if [ -z "$(swift /tmp/win.swift "$BID" 2>/dev/null | awk '/Height = [0-9]{3}/')" ]; then
              osascript -e 'tell application "System Events" to keystroke "n" using command down' || echo "keystroke failed"
            fi
            sleep "$W"
            screencapture -x -R0,0,1440,900 "shots/$LANG/mac-$NAME-screen.png" || true
            # The window itself (also when it is off screen or behind something)
            WIN=$(swift /tmp/win.swift "$BID" 2>/dev/null | tee -a shots/windows.txt | awk 'NR==1{print $1}')
            [ -n "$WIN" ] && screencapture -x -o -l "$WIN" "shots/$LANG/mac-$NAME.png" || true
            osascript -e "tell application id \"$BID\" to quit" || true
            sleep 6
            pkill -f "P2000 Apeldoorn.app/Contents/MacOS" || true
            sleep 2
          }
          for LANG in nl; do
            snap $LANG pager 16
            snap $LANG melding 18 -AAlertsMelding "$GUID"
            [ -n "$WID" ] && snap $LANG waarschuwing 18 -AAlertsWaarschuwing "$WID"
            snap $LANG statistieken 16 -AAlertsTab statistieken
          done
          find shots -name "*.png" | sort
      - name: Push to branch screenshots-mac
        if: always()
        run: |
          cd shots
          git init -q -b screenshots-mac
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Mac screenshots $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-mac
