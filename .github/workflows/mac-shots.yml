name: Mac screenshots

# Only the Mac app: pager, alert, warning and statistics in nl and en, each in a fresh app instance
# (no restored window state). Result on branch screenshots-mac.

on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/mac-shots.yml']

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      API: https://p2000-apeldoorn-api.lrvdlinden.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build (Debug)
        run: xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "P2000 Apeldoorn" -configuration Debug -destination "platform=macOS" -derivedDataPath buildmac CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u
      - name: Live data
        id: data
        run: |
          curl -sS "$API/v1/meldingen?limit=80" -o m.json
          curl -sS "$API/v1/waarschuwingen?days=14" -o w.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open("m.json")); w=json.load(open("w.json"))
          def ok(x): return x.get("locatie") and x.get("lat") is not None and str(x.get("prioriteit","")).upper() not in ("B1","B2","B3")
          pref=[x for x in m if ok(x) and x["dienst"]=="brandweer"] or [x for x in m if ok(x)] or m
          print("guid="+pref[0]["guid"])
          ws=[x for x in w if x["bron"] in ("burgernet","nlalert")]
          print("wid="+(ws[0]["id"] if ws else ""))
          PY
      - name: Screenshots
        run: |
          MACAPP=$(find buildmac/Build/Products -name "P2000 Apeldoorn.app" -maxdepth 3 | head -1)
          BIN="$MACAPP/Contents/MacOS/P2000 Apeldoorn"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$MACAPP/Contents/Info.plist")
          GUID="${{ steps.data.outputs.guid }}"; WID="${{ steps.data.outputs.wid }}"
          mkdir -p shots
          snap() { # lang name wait args...
            LANG=$1; NAME=$2; W=$3; shift 3
            mkdir -p "shots/$LANG"
            rm -rf ~/Library/Saved\ Application\ State/"$BID".savedState ~/Library/Containers/"$BID"/Data/Library/Saved\ Application\ State 2>/dev/null || true
            "$BIN" -AppleLanguages "($LANG)" -AppleLocale $([ $LANG = nl ] && echo nl_NL || echo en_US) -AAlertsScreenshots -ApplePersistenceIgnoreState YES "$@" >/dev/null 2>&1 &
            PID=$!
            sleep "$W"
            osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $PID) to true" || true
            sleep 2
            screencapture -x -R0,0,1440,900 "shots/$LANG/mac-$NAME.png" || true
            kill $PID 2>/dev/null; sleep 4; kill -9 $PID 2>/dev/null || true; sleep 1
          }
          for LANG in nl en; do
            snap $LANG pager 16
            snap $LANG melding 18 -AAlertsMelding "$GUID"
            [ -n "$WID" ] && snap $LANG waarschuwing 18 -AAlertsWaarschuwing "$WID"
            snap $LANG statistieken 16 -AAlertsTab statistieken
          done
          find shots -name "*.png" | sort
      - name: Push to branch screenshots-mac
        if: always()
        run: |
          cd shots
          git init -q -b screenshots-mac
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Mac screenshots $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-mac
