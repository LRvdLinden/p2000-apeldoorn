name: Diagnose bronnen
on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/diagnose.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          echo "== 112meldkamer raw"; curl -sS -m 20 -i https://api.112meldkamer.nl/v1/burgernet | head -c 1500; echo
          echo "== worker waarschuwingen"; curl -sS -m 20 "$A/v1/waarschuwingen?days=1" | head -c 3000; echo
          echo "== worker overview-status"; curl -sS -m 20 "$A/v1/meldingen?limit=1" | head -c 800; echo
          echo "== burgernet.nl api guesses"
          for u in https://www.burgernet.nl/api/actions https://www.burgernet.nl/burgernet/3967274; do echo "-- $u"; curl -sS -m 20 -A "Mozilla/5.0" -i "$u" | head -c 1200; echo; done
          true
