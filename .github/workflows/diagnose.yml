name: Diagnose bronnen
on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/diagnose.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: |
          set +e
          ID=$(npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const i=s.indexOf("[");const d=JSON.parse(s.slice(i)).find(x=>x.name==="p2000-apeldoorn");console.log(d?d.uuid:"")}catch{console.log("")}})')
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          q() { npx wrangler d1 execute p2000-apeldoorn --remote --json --command "$1" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const i=s.indexOf("[");console.log(JSON.stringify(JSON.parse(s.slice(i))[0].results,null,0))}catch(e){console.log(s.slice(0,800))}})'; }
          echo "== warnings_status"; q "SELECT key, value, at FROM kv WHERE key IN ('warnings_status','bronnen_status') OR key LIKE 'bron%'"
          echo "== laatste waarschuwingen"; q "SELECT id, bron, status, plaats, titel, start_at, end_at FROM waarschuwingen ORDER BY start_at DESC LIMIT 15"
          echo "== aantallen per bron"; q "SELECT bron, status, COUNT(*) n FROM waarschuwingen GROUP BY bron, status"
          curl -sS -m 20 -A "A-Alerts/2.0 (+https://a-alerts.nl)" https://www.burgernet.nl/burgernet/3967274 -o /tmp/d.html
          echo "== detail main"; sed -n '/<main/,/<\/main>/p' /tmp/d.html | grep -v "^\s*$" | grep -v "<svg\|<path" | head -150
          echo "== voorst"; curl -sS -m 20 -A "A-Alerts/2.0" -o /dev/null -w "%{http_code}\n" https://www.burgernet.nl/gemeente/Oost-Nederland/VOORST
          true
