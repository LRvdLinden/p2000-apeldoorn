name: Diagnose bronnen
on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/diagnose.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== 112meldkamer burgernet (Apeldoorn/Voorst)"
          curl -sS -m 20 https://api.112meldkamer.nl/v1/burgernet | jq -c '.[] | select((.location|ascii_downcase|test("apeldoorn|voorst")) or ((.link//"")|test("3967274")))' | head -20
          echo "== aantal"; curl -sS -m 20 https://api.112meldkamer.nl/v1/burgernet | jq 'length'
          echo "== eerste"; curl -sS -m 20 https://api.112meldkamer.nl/v1/burgernet | jq -c '.[0:2]'
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          echo "== worker waarschuwingen"; curl -sS -m 20 "$A/v1/waarschuwingen?days=1" | head -c 3000; echo
          echo "== worker meldingen"; curl -sS -m 20 "$A/v1/meldingen?limit=1" | head -c 1500; echo
          echo "== burgernet html"; curl -sS -m 20 -A "Mozilla/5.0" https://www.burgernet.nl/burgernet/3967274 | grep -o "<title>[^<]*" | head -2
