name: Diagnose bronnen
on:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/diagnose.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev/v1/mapkit-token
          for o in https://a-alerts.nl https://www.a-alerts.nl https://p2000-apeldoorn.nl; do echo "== $o"; curl -sS -m 15 -o /dev/null -w "%{http_code}\n" -H "Origin: $o" $A; done
          echo "== zonder origin"; curl -sS -m 15 -o /dev/null -w "%{http_code}\n" $A
