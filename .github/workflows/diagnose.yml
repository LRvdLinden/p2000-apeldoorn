name: Diagnose bronnen
on:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/diagnose.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://p2000-apeldoorn-api.lrvdlinden.workers.dev
          for id in burgernet:3967274 $(curl -sS "$A/v1/waarschuwingen?days=14" | jq -r '.[0:3][].id'); do echo "== $id"; curl -sS -m 20 "$A/v1/waarschuwingen/$id/weather" | head -c 300; echo; done
