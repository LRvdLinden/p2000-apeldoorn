name: Website-zip

# Builds a ready-to-upload zip of website/ for your own hosting (download it under the run's "Artifacts").
on:
  push:
    branches: [main]
    paths: ["website/**", "worker/content/**", ".github/workflows/website.yml"]
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teksten (privacy, voorwaarden, disclaimer)
        run: mkdir -p website/data && cp worker/content/*.json website/data/
      - uses: actions/upload-artifact@v4
        with:
          name: p2000-apeldoorn-website
          path: website
          include-hidden-files: true
          retention-days: 30
