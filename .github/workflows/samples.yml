name: Bronnen-voorbeelden (eenmalig)
on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: [tools/samples/fetch_samples.sh]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/samples/fetch_samples.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/samples/*.json
          git commit -m "Voorbeelden van de nieuwe bronnen (NL-Alert, Burgernet, KNMI, ADS-B)" || echo "geen wijzigingen"
          git push
