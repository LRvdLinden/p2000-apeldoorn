name: Heli- en kazernedata (eenmalig)
on:
  push:
    branches: [a-alerts]
    paths: [tools/geodata/fetch_kazernes.sh]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/geodata/fetch_kazernes.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/samples tools/geodata
          git commit -m "Samples: adsb.lol helikopters en OSM-kazernes" || echo "geen wijzigingen"
          git pull --rebase && git push
