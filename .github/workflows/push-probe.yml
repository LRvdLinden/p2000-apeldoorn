name: Push probe (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/push-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci >/dev/null
      - run: |
          ID=$(npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.indexOf("[");const d=JSON.parse(s.slice(i)).find(x=>x.name==="p2000-apeldoorn");console.log(d?d.uuid:"")})')
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          q() { echo "== $1"; npx wrangler d1 execute p2000-apeldoorn --remote --json --command "$1" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const i=s.indexOf("[");for(const r of JSON.parse(s.slice(i))[0].results)console.log(JSON.stringify(r))}catch(e){console.log(s.slice(0,500))}})'; }
          q "SELECT platform, environment, enabled, COUNT(*) n, MAX(updated_at) last_upd, MAX(app_version) v FROM devices GROUP BY platform, environment, enabled"
          q "SELECT substr(token,1,10) t, platform, environment, app_version, enabled, datetime(updated_at/1000,'unixepoch') upd FROM devices ORDER BY updated_at DESC LIMIT 12"
          q "SELECT COUNT(*) n, MIN(datetime(created_at/1000,'unixepoch')) oudste, MAX(datetime(created_at/1000,'unixepoch')) nieuwste FROM outbox"
          q "SELECT key, substr(value,1,400) v, datetime(at/1000,'unixepoch') at FROM kv WHERE key IN ('status_push','cron_run','push_fout','last_push_error') OR key LIKE 'push%' OR key LIKE 'apns%' OR key LIKE 'fcm%'"
