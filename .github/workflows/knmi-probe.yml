name: KNMI probe (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/knmi-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://www.knmi.nl/api/v1/weather-warnings.json -o k.json
          python3 - <<'PY'
          import json
          d=json.load(open("k.json"))
          def walk(x, path="", depth=0):
              if depth>7: return
              if isinstance(x, dict):
                  for k,v in x.items(): walk(v, f"{path}.{k}", depth+1)
              elif isinstance(x, list):
                  if x: walk(x[0], path+"[0]", depth+1)
              else:
                  s=str(x)
                  print(f"{path} = {s[:600]}")
          walk(d)
          PY
