name: KNMI probe (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: ['.github/workflows/knmi-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.knmi.nl/nederland-nu/weer/waarschuwingen https://www.knmi.nl/nederland-nu/weer/verwachtingen; do
            echo "== $u"; curl -sS "$u" -o p.html
            python3 - <<'PY'
          import re,html
          s=open("p.html",encoding="utf-8").read()
          for m in re.finditer(r'(?i)(dichte mist|meer informatie|zicht)', s):
              a=max(0,m.start()-700); print("---", re.sub(r'\s+',' ',s[a:m.end()+500])); 
          PY
          done 2>&1 | head -c 9000
