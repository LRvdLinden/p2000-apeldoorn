name: Build

# Manual check build of all Apple targets (no signing).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Build iOS / iPadOS (+ watchOS)
        run: |
          xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "P2000 Apeldoorn" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u | head -n 150
          exit ${PIPESTATUS[0]}

      - name: Build macOS
        run: |
          xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "P2000 Apeldoorn" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u | head -n 150
          exit ${PIPESTATUS[0]}

      - name: Build P2000Beheer (iOS)
        run: |
          xcodebuild -project beheer/P2000Beheer.xcodeproj -scheme P2000Beheer \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u | head -n 150
          exit ${PIPESTATUS[0]}

      - name: Build P2000Beheer (macOS)
        run: |
          xcodebuild -project beheer/P2000Beheer.xcodeproj -scheme P2000Beheer \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u | head -n 150
          exit ${PIPESTATUS[0]}
