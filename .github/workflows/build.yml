name: Build

# Manual check build (no signing). Uses the repo secret P2000_PAGE_API_URL for the live feed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Write Secrets.xcconfig from repo secret
        env:
          P2000_PAGE_API_URL: ${{ secrets.P2000_PAGE_API_URL }}
        run: |
          if [ -n "$P2000_PAGE_API_URL" ]; then
            # "//" starts a comment in .xcconfig files → write https:/$()/
            printf 'P2000_PAGE_API_URL = %s\n' "$(printf '%s' "$P2000_PAGE_API_URL" | sed 's#https://#https:/$()/#')" > Config/Secrets.xcconfig
            echo "Secrets.xcconfig written"
          else
            echo "No P2000_PAGE_API_URL secret – building without the live feed"
          fi

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Build iOS / iPadOS (+ watchOS)
        run: |
          xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "P2000 Apeldoorn" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u | head -n 150
          exit ${PIPESTATUS[0]}

      - name: Build macOS
        run: |
          xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "P2000 Apeldoorn" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u | head -n 150
          exit ${PIPESTATUS[0]}
