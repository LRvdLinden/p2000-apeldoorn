name: Worker

# Tests the Cloudflare Worker and deploys it (when the Cloudflare secrets are set).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; all other values come from the
# existing secrets (P2000_PAGE_API_URL, APN_*, WEB_*, MAPS_SERVER_API_*).
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**"]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

      - name: Cloudflare-secrets aanwezig?
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ontbreken – alleen getest, niet gedeployd."; fi

      - name: D1-database (aanmaken als hij nog niet bestaat)
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          find_id() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const i=s.indexOf("[");const d=JSON.parse(s.slice(i)).find(x=>x.name==="p2000-apeldoorn");console.log(d?d.uuid:"")}catch{console.log("")}})'; }
          if ! npx wrangler d1 list > /dev/null 2>&1; then
            echo "::error::Het Cloudflare-token mag geen D1-databases beheren. Voeg bij het token de permissie Account → D1 → Edit toe (en controleer CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create p2000-apeldoorn --location weur
            ID=$(find_id)
          fi
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute p2000-apeldoorn --remote --file schema.sql

      - name: workers.dev-subdomein (eenmalig)
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result?.subdomain||"")}catch{console.log("")}})')
          if [ -n "$CUR" ]; then echo "Subdomein: $CUR.workers.dev"; exit 0; fi
          for NAME in ${{ vars.WORKERS_SUBDOMAIN || 'lrvdlinden' }} lrvdlinden-apps p2000-apeldoorn pixelforges-p2000; do
            R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" -d "{\"subdomain\":\"$NAME\"}" "$API")
            if echo "$R" | grep -qE '"success": *true'; then echo "Subdomein geregistreerd: $NAME.workers.dev"; exit 0; fi
            echo "$NAME niet beschikbaar: $R"
          done
          echo "::error::Kon geen workers.dev-subdomein registreren. Kies er zelf een in Cloudflare (Workers & Pages → je subdomein)."
          exit 1

      - name: Deploy
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Secrets naar de Worker
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          P2000_PAGE_API_URL: ${{ secrets.P2000_PAGE_API_URL }}
          APN_KEY_ID: ${{ secrets.APN_KEY_ID }}
          APN_TEAM_ID: ${{ secrets.APN_TEAM_ID }}
          APN_P8_CERT: ${{ secrets.APN_P8_CERT }}
          WEB_MAPKIT_JS_KEY_ID: ${{ secrets.WEB_MAPKIT_JS_KEY_ID }}
          WEB_MAPKIT_JS_TEAM_ID: ${{ secrets.WEB_MAPKIT_JS_TEAM_ID }}
          WEB_MAPKIT_JS_P8: ${{ secrets.WEB_MAPKIT_JS_P8 }}
          WEB_WEATHERKIT_KEY_ID: ${{ secrets.WEB_WEATHERKIT_KEY_ID }}
          WEB_WEATHERKIT_TEAM_ID: ${{ secrets.WEB_WEATHERKIT_TEAM_ID }}
          WEB_WEATHERKIT_P8: ${{ secrets.WEB_WEATHERKIT_P8 }}
          MAPS_SERVER_API_KEY_ID: ${{ secrets.MAPS_SERVER_API_KEY_ID }}
          MAPS_SERVER_API_TEAM_ID: ${{ secrets.MAPS_SERVER_API_TEAM_ID }}
          MAPS_SERVER_API_P8: ${{ secrets.MAPS_SERVER_API_P8 }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BACKFILL: "1"
        run: |
          node -e '
            const keys = ["P2000_PAGE_API_URL","APN_KEY_ID","APN_TEAM_ID","APN_P8_CERT","WEB_MAPKIT_JS_KEY_ID","WEB_MAPKIT_JS_TEAM_ID",
              "WEB_MAPKIT_JS_P8","WEB_WEATHERKIT_KEY_ID","WEB_WEATHERKIT_TEAM_ID","WEB_WEATHERKIT_P8","MAPS_SERVER_API_KEY_ID",
              "MAPS_SERVER_API_TEAM_ID","MAPS_SERVER_API_P8","ADMIN_TOKEN","BACKFILL"];
            const out = {}; for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Secrets:", Object.keys(out).join(", "));'
          npx wrangler secret bulk secrets.json
          rm secrets.json

      - name: Adres van de API
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### API: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Controle: $URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $URL"
