name: Worker verwijderen

# Eenmalig: verwijdert de oude Cloudflare Worker p2000-apeldoorn-api, de D1-database en de Durable Object.
# De API draait nu op api.a-alerts.nl (PHP + MariaDB).
on:
  push:
    branches: [a-alerts]
    paths: [".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  verwijder:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Worker verwijderen (incl. Durable Object-data)
        run: npx --yes wrangler@4 delete --name p2000-apeldoorn-api --force
      - name: D1-database verwijderen
        run: npx --yes wrangler@4 d1 delete p2000-apeldoorn -y
      - name: Controle
        run: |
          npx --yes wrangler@4 d1 list || true
          curl -s -o /dev/null -w "workers.dev: %{http_code}\n" https://p2000-apeldoorn-api.lrvdlinden.workers.dev/health || true
