name: A-Alerts live health check

on:
  push:
    branches: [a-alerts]
    paths: [".github/workflows/a-alerts-health.yml"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Verify api.a-alerts.nl, Koyeb and the sources (read only)
        run: |
          node --input-type=module <<'NODE'
          const base = "https://api.a-alerts.nl";
          let last = null;
          for (let n = 0; n < 10; n++) {
            try {
              const response = await fetch(base + "/health", { signal: AbortSignal.timeout(18000), headers: { "cache-control": "no-cache" } });
              if (!response.ok) throw new Error("health HTTP " + response.status);
              last = await response.json();
              console.log(JSON.stringify({
                attempt: n + 1, ok: last.ok, primaryLastOk: last.feed?.lastOk,
                primaryError: last.feed?.lastError, koyeb: last.koyeb,
                alerts: last.meldingen, warningServices: Boolean(last.waarschuwingen),
                fcm: last.fcm, radar: last.radar
              }));
              if (last.ok && last.koyeb?.configured && last.koyeb?.lastMessage &&
                  typeof last.meldingen === "number" && last.fcm && last.radar) {
                const list = await (await fetch(base + "/v1/meldingen?limit=2", { signal: AbortSignal.timeout(18000) })).json();
                if (!Array.isArray(list)) throw new Error("meldingen endpoint invalid");
                // The public P2000 status must be green if EITHER source is currently healthy.
                const statusRes = await fetch(base + "/v1/status", { signal: AbortSignal.timeout(18000), headers: { "cache-control": "no-cache" } });
                if (!statusRes.ok) throw new Error("status HTTP " + statusRes.status);
                const status = await statusRes.json();
                const p2000 = status.groepen?.flatMap(g => g.onderdelen || []).find(x => x.id === "p2000");
                const active = status.incidenten?.actief?.filter(x => x.onderdelen?.includes("p2000")) || [];
                const newest = Math.max(Date.parse(last.feed?.lastOk || 0) || 0, Date.parse(last.koyeb?.lastMessage || 0) || 0);
                console.log("PUBLIC P2000 STATUS:", JSON.stringify({ state: p2000?.staat, detail: p2000?.detail, freshestSourceSeconds: Math.round((Date.now()-newest)/1000), manuallyOpenP2000Incidents: active.map(x => x.titel) }));
                if (!p2000) throw new Error("P2000 component missing from status page");
                if (newest > Date.now() - 180_000 && p2000.staat !== "ok")
                  throw new Error("P2000 status is not green despite a healthy source");
                // The previously missing Koyeb alert must now be plotted at Apeldoorn's
                // known town centre without claiming that the incident itself is there.
                const guid = "f9c47be5-dd07-75aa-0ffc-9ae2482d0f05";
                const alertRes = await fetch(base + "/v1/meldingen/" + guid, { signal: AbortSignal.timeout(18000), cache: "no-store" });
                if (!alertRes.ok) throw new Error("Old Koyeb alert HTTP " + alertRes.status);
                const old = await alertRes.json();
                console.log("OLD KOYEB MAP:", JSON.stringify({guid:old.guid, stad:old.stad, lat:old.lat, lon:old.lon, plaatscentrum:old.plaatscentrum, locatie:old.locatie}));
                if (old.plaatscentrum !== true || Math.abs(old.lat - 52.21084) > 0.00001 || Math.abs(old.lon - 5.97373) > 0.00001)
                  throw new Error("Historic Koyeb alert lacks the town centre fallback marker");
                // Check that users receive the actual new pager assets, not only the new backend.
                const page = await (await fetch("https://a-alerts.nl/pager/?smoke=woonplaatskaart", { signal: AbortSignal.timeout(18000), cache: "no-store" })).text();
                if (!page.includes("pager.js?v=87")) throw new Error("Website has not deployed the new pager module yet");
                const js = await (await fetch("https://a-alerts.nl/assets/js/pager.js?smoke=woonplaatskaart", { signal: AbortSignal.timeout(18000), cache: "no-store" })).text();
                if (!js.includes("Exacte incidentlocatie onbekend.") || !js.includes("Route naar woonplaatscentrum"))
                  throw new Error("Website is still serving old map code");
                console.log("PASS: historic Koyeb message has an Apple Maps town marker and live pager assets deployed.");
                console.log("PASS: Koyeb and the existing A-Alerts API are live, sample alerts:", list.length);
                process.exit(0);
              }
            } catch (e) {
              console.error("Attempt", n + 1, "failed:", e.message);
            }
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          console.error("FAIL: no independent Koyeb events observed. Worker may still be online.");
          process.exit(1);
          NODE
