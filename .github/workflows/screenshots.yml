name: Screenshots

# Builds the apps for the simulator (and macOS) and takes screenshots with live data in Dutch and English,
# for the website and the App Store. Result: branch "screenshots" (force-pushed), folders nl/ and en/.
on:
  workflow_dispatch:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/screenshots.yml]

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      API: https://p2000-apeldoorn-api.lrvdlinden.workers.dev
      BUNDLE: nl.lrvdlinden.p2000apeldoorn
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Pick devices
        id: dev
        run: |
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']; want=sys.argv[1]; deny=sys.argv[2]
          best=None
          for rt in sorted(d, key=lambda k: [int(x) for x in re.findall(r'\d+', k)]):
              for x in d[rt]:
                  if re.search(want, x['name']) and not re.search(deny, x['name']): best=x['udid']
          print(best or '')" "$1" "$2"; }
          echo "iphone=$(pick 'iPhone 1[6-9] Pro$|iPhone 1[6-9]$' 'Max|Plus|e$')" >> "$GITHUB_OUTPUT"
          echo "ipad=$(pick 'iPad Pro.*13' 'xxx')" >> "$GITHUB_OUTPUT"
          echo "watch=$(pick 'Apple Watch (Series 1[01]|Ultra).*' 'xxx')" >> "$GITHUB_OUTPUT"
          echo "tv=$(pick 'Apple TV 4K' 'xxx')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Build (Debug)
        run: |
          b() { xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "$1" -configuration Debug -destination "$2" -derivedDataPath "$3" CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u; }
          b "P2000 Apeldoorn" "id=${{ steps.dev.outputs.iphone }}" build
          b "P2000 Apeldoorn Watch" "id=${{ steps.dev.outputs.watch }}" buildw
          b "P2000 Apeldoorn TV" "id=${{ steps.dev.outputs.tv }}" buildtv
          b "P2000 Apeldoorn" "platform=macOS" buildmac
      - name: Live data to show
        id: data
        run: |
          curl -sS "$API/v1/meldingen?limit=80" -o m.json
          curl -sS "$API/v1/waarschuwingen?days=14" -o w.json
          curl -sS "$API/v1/helikopters" -o h.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open("m.json")); w=json.load(open("w.json"))
          def ok(x): return x.get("locatie") and x.get("lat") is not None and str(x.get("prioriteit","")).upper() not in ("B1","B2","B3")
          pref=[x for x in m if ok(x) and x["dienst"]=="brandweer"] or [x for x in m if ok(x)] or m
          print("guid="+pref[0]["guid"])
          ws=[x for x in w if x["bron"] in ("burgernet","nlalert")]
          print("wid="+(ws[0]["id"] if ws else ""))
          hs=json.load(open("h.json")).get("helikopters", [])
          hs=sorted(hs, key=lambda h: (h.get("op_grond", True), h.get("soort") != "trauma"))
          print("heli="+(hs[0]["id"] if hs else ""))
          PY
      - name: Screenshots
        run: |
          export SIMCTL_CHILD_TZ=Europe/Amsterdam
          APP=$(find build/Build/Products -name "P2000 Apeldoorn.app" -maxdepth 3 | head -1)
          WAPP=$(find buildw/Build/Products -name "P2000 Apeldoorn Watch.app" -maxdepth 3 | head -1)
          TVAPP=$(find buildtv/Build/Products -name "*.app" -maxdepth 3 | head -1)
          MACAPP=$(find buildmac/Build/Products -name "P2000 Apeldoorn.app" -maxdepth 3 | head -1)
          GUID="${{ steps.data.outputs.guid }}"; WID="${{ steps.data.outputs.wid }}"; HELI="${{ steps.data.outputs.heli }}"
          for LANG in nl en; do
            [ $LANG = nl ] && LOC=nl_NL || LOC=en_US
            L="-AppleLanguages ($LANG) -AppleLocale $LOC -AAlertsScreenshots"
            mkdir -p shots/$LANG
            shoot() { # device prefix
              D=$1; P=$2
              xcrun simctl boot "$D" || true
              xcrun simctl bootstatus "$D" -b
              xcrun simctl status_bar "$D" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
              xcrun simctl ui "$D" appearance light || true
              xcrun simctl location "$D" set 52.2112,5.9699 || true
              xcrun simctl install "$D" "$APP"
              xcrun simctl privacy "$D" grant location "$BUNDLE" || true
              snap() { xcrun simctl launch --terminate-running-process "$D" "$BUNDLE" $L $2; sleep $3; xcrun simctl io "$D" screenshot "shots/$LANG/$P-$1.png"; }
              snap pager "" 16
              snap kaart "-AAlertsTab kaart" 16
              snap statistieken "-AAlertsTab statistieken" 12
              snap instellingen "-AAlertsTab instellingen" 10
              snap melding "-AAlertsMelding $GUID" 18
              [ -n "$WID" ] && snap waarschuwing "-AAlertsWaarschuwing $WID" 18
              [ -n "$HELI" ] && snap heli "-AAlertsHeli $HELI" 22
              xcrun simctl shutdown "$D" || true
            }
            shoot "${{ steps.dev.outputs.iphone }}" iphone
            shoot "${{ steps.dev.outputs.ipad }}" ipad
            # Welcome screen (fresh install)
            D="${{ steps.dev.outputs.iphone }}"
            xcrun simctl boot "$D"; xcrun simctl bootstatus "$D" -b
            xcrun simctl status_bar "$D" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            xcrun simctl uninstall "$D" "$BUNDLE" || true; xcrun simctl install "$D" "$APP"
            xcrun simctl launch "$D" "$BUNDLE" -AppleLanguages "($LANG)" -AppleLocale $LOC; sleep 10
            xcrun simctl io "$D" screenshot "shots/$LANG/iphone-welkom.png"
            xcrun simctl shutdown "$D" || true
            # Apple Watch
            W="${{ steps.dev.outputs.watch }}"
            xcrun simctl boot "$W"; xcrun simctl bootstatus "$W" -b
            xcrun simctl status_bar "$W" override --time "9:41" || true
            xcrun simctl install "$W" "$WAPP"
            xcrun simctl launch --terminate-running-process "$W" "$BUNDLE.watchkitapp" -AppleLanguages "($LANG)" -AppleLocale $LOC; sleep 15
            xcrun simctl io "$W" screenshot "shots/$LANG/watch-lijst.png"
            xcrun simctl shutdown "$W" || true
            # Apple TV
            T="${{ steps.dev.outputs.tv }}"
            if [ -n "$T" ] && [ -n "$TVAPP" ]; then
              xcrun simctl boot "$T"; xcrun simctl bootstatus "$T" -b
              xcrun simctl install "$T" "$TVAPP"
              TVB=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$TVAPP/Info.plist")
              for tab in meldkamer waarschuwingen statistieken; do
                xcrun simctl launch --terminate-running-process "$T" "$TVB" $L -AAlertsTab $tab; sleep 18
                xcrun simctl io "$T" screenshot "shots/$LANG/tv-$tab.png"
              done
              xcrun simctl shutdown "$T" || true
            fi
            # Mac
            if [ -n "$MACAPP" ]; then
              system_profiler SPDisplaysDataType | grep -i resolution || true
              open -n "$MACAPP" --args $L
              sleep 14
              screencapture -x -R0,0,1440,900 "shots/$LANG/mac-pager.png" || true
              pkill -f "P2000 Apeldoorn.app/Contents/MacOS" || true
              open -n "$MACAPP" --args $L -AAlertsTab kaart
              sleep 16
              screencapture -x -R0,0,1440,900 "shots/$LANG/mac-kaart.png" || true
              pkill -f "P2000 Apeldoorn.app/Contents/MacOS" || true
              screencapture -x "shots/$LANG/mac-full.png" || true
            fi
          done
          find shots -name "*.png" | sort
      - name: Push to branch screenshots
        if: always()
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots $(date -u +%FT%TZ) from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
