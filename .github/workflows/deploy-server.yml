name: Test API-server

# Railway deploys server/ itself from GitHub (Root Directory "/server").
# This workflow only runs the server tests on every change.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
        working-directory: server
