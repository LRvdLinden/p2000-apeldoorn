name: Diag iOS weer (tijdelijk)
on:
  push:
    branches: [a-alerts]
    paths: [.github/workflows/diag-ios-weer.yml]
permissions:
  contents: write
jobs:
  d:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      API: https://p2000-apeldoorn-api.lrvdlinden.workers.dev
      BUNDLE: nl.lrvdlinden.p2000apeldoorn
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Device
        id: dev
        run: |
          U=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices'];best=''
          for rt in sorted(d, key=lambda k:[int(x) for x in re.findall(r'\d+',k)]):
            for x in d[rt]:
              if re.search(r'iPhone 1[6-9] Pro$|iPhone 1[6-9]$',x['name']): best=x['udid']
          print(best)")
          echo "u=$U" >> $GITHUB_OUTPUT
      - name: Build
        run: xcodebuild -project P2000Apeldoorn.xcodeproj -scheme "P2000 Apeldoorn" -configuration Debug -destination "id=${{ steps.dev.outputs.u }}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\* BUILD" | sort -u
      - name: Run
        run: |
          D=${{ steps.dev.outputs.u }}
          G=$(curl -s "$API/v1/meldingen?limit=40" | python3 -c "import json,sys;l=json.load(sys.stdin);c=[m for m in l if m.get('locatie') and m.get('lat')] or l;print(c[0]['guid'])")
          APP=$(find build/Build/Products -name "P2000 Apeldoorn.app" -maxdepth 3 | head -1)
          xcrun simctl boot $D; xcrun simctl bootstatus $D -b
          xcrun simctl install $D "$APP"
          mkdir -p out
          xcrun simctl launch $D $BUNDLE -AppleLanguages "(nl)" -AppleLocale nl_NL -AAlertsScreenshots -AAlertsMelding $G -AAlertsScrollEnd YES
          sleep 30
          xcrun simctl io $D screenshot out/einde.png
          xcrun simctl spawn $D log show --last 3m --style compact --predicate 'subsystem == "nl.lrvdlinden.p2000apeldoorn" OR eventMessage CONTAINS[c] "weather" OR eventMessage CONTAINS[c] "weatherkit"' > out/log.txt 2>&1 || true
          grep -iE "weer|weather" out/log.txt | head -60
      - name: Push
        if: always()
        run: |
          cd out && git init -q -b diag-ios && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm diag && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-ios
